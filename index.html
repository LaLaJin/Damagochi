<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>도치 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone-sized column. Game HUD, the hedgehog's home scene, a quest strip, gauges, then a 4x2 action pad. */
:root {
  --bg: #e4ebdc;
  --surface: #f7f9f2;
  --ink: #26241f;
  --muted: #66665a;
  --line: #cfd8c3;
  --accent: #d6455f;      /* raspberry: primary actions, level badge */
  --accent-ink: #ffffff;
  --moss: #3f6b3a;        /* forest green: progress, XP */
  --gold: #e6a817;        /* rewards, records, rare finds */
  --good: #4f9a5b;
  --warn: #d4952a;
  --bad: #cf4a3c;
  --rare: #3b82c4;
  --legend: #b453d6;
  --shadow: 0 1px 0 rgba(38, 36, 31, .08), 0 6px 18px -10px rgba(38, 36, 31, .35);
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181c17; --surface: #232922; --ink: #edece3; --muted: #a4a796; --line: #38402f;
    --accent: #ee6b83; --accent-ink: #181c17; --moss: #8dbb77; --gold: #f2c14e;
    --good: #6fbf7a; --warn: #e8b04d; --bad: #ef6b5c; --rare: #6fb0ee; --legend: #d38ff0;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181c17; --surface: #232922; --ink: #edece3; --muted: #a4a796; --line: #38402f;
  --accent: #ee6b83; --accent-ink: #181c17; --moss: #8dbb77; --gold: #f2c14e;
  --good: #6fbf7a; --warn: #e8b04d; --bad: #ef6b5c; --rare: #6fb0ee; --legend: #d38ff0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  padding-inline: 16px;
  padding-block: 12px 20px;
}
button { font: inherit; color: inherit; }
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* ---------- HUD ---------- */
.top { display: flex; align-items: center; gap: 8px; }
.lv {
  flex: none; width: 50px; height: 50px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  font-family: var(--font-display); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
}
.lv small { font-size: 11px; letter-spacing: .08em; opacity: .85; }
.lv b { font-weight: 400; font-size: 24px; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.name-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.name { flex: 0 1 auto; max-width: 100%; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage { flex: 1 1 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.xp { position: relative; height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xp > i { display: block; height: 100%; background: var(--moss); width: 0; transition: width .5s; }
.xp > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.coins {
  display: flex; align-items: center; gap: 5px; flex: none;
  font-family: var(--font-display); font-size: 18px;
  padding: 6px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.berry { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9bb0, var(--accent) 60%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.icon-btn { flex: none; border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- scene ---------- */
.scene {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3.3;
  border-radius: 22px; overflow: hidden; isolation: isolate;
  box-shadow: var(--shadow);
  --sky1: #bfe3f2; --sky2: #eaf6ea; --ground1: #c9a978; --ground2: #b08d5c; --grass: #7da45d;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2) 70%);
  transition: background 1s;
  user-select: none; -webkit-user-select: none;
}
.scene[data-tod="dawn"]  { --sky1: #f6c7b4; --sky2: #fbe9cf; }
.scene[data-tod="dusk"]  { --sky1: #e79a7c; --sky2: #f6d0a2; --grass: #6c8f50; }
.scene[data-tod="night"] { --sky1: #142040; --sky2: #2f3f66; --ground1: #6d5a42; --ground2: #5a4935; --grass: #3f5a36; }
.sky-body { position: absolute; top: 9%; right: 10%; width: 13%; aspect-ratio: 1; border-radius: 50%; background: #ffd65a; box-shadow: 0 0 0 8px rgba(255, 214, 90, .25), 0 0 40px rgba(255, 214, 90, .6); transition: all 1s; }
.scene[data-tod="dusk"] .sky-body { background: #ff9d5c; top: 26%; box-shadow: 0 0 40px rgba(255, 140, 80, .6); }
.scene[data-tod="night"] .sky-body { background: #f4f1d9; box-shadow: inset -9px -3px 0 0 #d9d4ad, 0 0 30px rgba(244, 241, 217, .35); }
.stars { position: absolute; inset: 0 0 40% 0; opacity: 0; transition: opacity 1s; }
.scene[data-tod="night"] .stars { opacity: 1; }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 50% { opacity: .25; } }
.hill { position: absolute; left: -10%; right: -10%; bottom: 22%; height: 30%; border-radius: 50% 50% 0 0; background: var(--grass); opacity: .55; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(var(--ground1), var(--ground2)); }
.ground::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 12px; background: radial-gradient(circle at 6px 6px, var(--grass) 6px, transparent 6.5px) 0 0 / 14px 12px repeat-x; }
.hut { position: absolute; left: 4%; bottom: 20%; width: 24%; aspect-ratio: 1.15; }
.hut svg { width: 100%; height: 100%; display: block; }

.hog {
  position: absolute; bottom: 9%; left: 50%; width: 40%; aspect-ratio: 1;
  transform: translateX(-50%); transition: left 2.6s ease-in-out;
  cursor: pointer; z-index: 3; touch-action: manipulation;
}
.hog-inner { width: 100%; height: 100%; transform-origin: 50% 100%; transition: transform .6s; }
.hog svg, .catcher svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bob { transform-origin: 100px 190px; animation: bob 2.4s infinite ease-in-out; }
.hog.walking .bob { animation: waddle .45s infinite ease-in-out; }
.hog.hop .bob { animation: hop .5s 2 ease-out; }
.hog[data-mood="sleep"] .bob { animation: breathe 3.6s infinite ease-in-out; }
.hog[data-mood="curl"] .bob { animation: shiver .12s infinite; }
@keyframes bob { 50% { transform: translateY(-3px) scaleY(1.015); } }
@keyframes waddle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-3px); } }
@keyframes hop { 40% { transform: translateY(-26px) scaleY(1.05); } 80% { transform: translateY(0) scaleY(.94); } }
@keyframes breathe { 50% { transform: scaleY(.97) scaleX(1.02); } }
@keyframes shiver { 50% { transform: translateX(1.5px); } }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.munch { transform-box: fill-box; transform-origin: center top; animation: munch .3s infinite; }
@keyframes munch { 50% { transform: scaleY(.4); } }

.bubble {
  position: absolute; z-index: 6; left: 50%; bottom: 52%; transform: translateX(-50%);
  max-width: 76%; width: max-content;
  background: #fffdf7; color: #26241f; border-radius: 16px; padding: 8px 12px;
  font-size: 14px; line-height: 1.35; text-align: center;
  box-shadow: 0 4px 14px -6px rgba(0,0,0,.35);
  transition: opacity .25s, transform .25s;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fffdf7; }
.bubble.hide { opacity: 0; transform: translateX(-50%) translateY(6px); pointer-events: none; }

.poop { position: absolute; bottom: 7%; font-size: clamp(18px, 6vw, 26px); z-index: 4; cursor: pointer; background: none; border: 0; padding: 4px; line-height: 1; animation: pop .35s ease-out; }
.poop .stink { position: absolute; left: 50%; top: -10px; width: 2px; height: 10px; border-radius: 2px; background: #8a9a5b; opacity: .6; animation: stink 2s infinite; }
@keyframes stink { 0% { transform: translateY(4px) scaleY(.4); opacity: 0; } 50% { opacity: .7; } 100% { transform: translateY(-8px); opacity: 0; } }
@keyframes pop { from { transform: scale(0); } }

.drop { position: absolute; z-index: 5; font-size: clamp(22px, 7vw, 30px); animation: drop .6s cubic-bezier(.3, 1.6, .5, 1) forwards; pointer-events: none; }
@keyframes drop { from { transform: translateY(-120px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.float { position: absolute; z-index: 9; pointer-events: none; font-family: var(--font-display); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); animation: floatup 1.4s ease-out forwards; font-size: 20px; white-space: nowrap; }
.float.big { font-size: 32px; color: #ffe27a; }
@keyframes floatup { to { translate: 0 -60px; opacity: 0; } }
.bubbles i { position: absolute; z-index: 6; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); background: rgba(190, 230, 255, .35); animation: suds 1.6s ease-out forwards; pointer-events: none; }
@keyframes suds { from { transform: scale(.2); opacity: 1; } to { transform: translateY(-70px) scale(1); opacity: 0; } }

.night-veil { position: absolute; inset: 0; z-index: 5; background: rgba(10, 14, 35, .55); opacity: 0; pointer-events: none; transition: opacity .8s; }
.scene.sleeping .night-veil { opacity: 1; }
.zzz { position: absolute; z-index: 6; font-family: var(--font-display); color: #e9ecff; pointer-events: none; animation: zzz 3s infinite ease-out; opacity: 0; }
@keyframes zzz { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(24px, -50px) scale(1.2); opacity: 0; } }

/* away on an expedition */
.away {
  position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 4;
  width: min(82%, 300px); background: rgba(255, 253, 247, .94); color: #26241f; border-radius: 18px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 18px -8px rgba(0,0,0,.4);
}
.away .sign { display: flex; align-items: center; gap: 10px; }
.away .sign .g { font-size: 30px; line-height: 1; }
.away h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.away p { margin: 0; font-size: 13px; color: #5d5b50; }
.away .bar { height: 8px; border-radius: 99px; background: #e2e0d2; overflow: hidden; }
.away .bar > i { display: block; height: 100%; background: #3f6b3a; width: 0; transition: width 1s linear; }
.away .time { font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.footprints { position: absolute; bottom: 4%; left: 45%; z-index: 3; font-size: 14px; opacity: .5; letter-spacing: 6px; }

/* mini-games */
.game { position: absolute; inset: 0; z-index: 8; background: rgba(30, 24, 12, .32); touch-action: none; overflow: hidden; }
.game-hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 19px; font-variant-numeric: tabular-nums; pointer-events: none; z-index: 2; }
.combo { position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-family: var(--font-display); font-size: 22px; color: #ffe27a; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none; z-index: 2; }
.target { position: absolute; width: 56px; height: 56px; border: 0; background: none; padding: 0; cursor: pointer; animation: wormin .2s ease-out; touch-action: manipulation; font-size: 36px; line-height: 56px; text-align: center; }
.target svg { width: 100%; height: 100%; }
.target.got { animation: wormout .25s forwards; pointer-events: none; }
.target.gold svg .seg, .target.gold svg .head { fill: #f2c94c; }
@keyframes wormin { from { transform: scale(0) rotate(-30deg); } }
@keyframes wormout { to { transform: scale(1.6); opacity: 0; } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.catcher { position: absolute; bottom: 4%; width: 22%; aspect-ratio: 1; transform: translateX(-50%); pointer-events: none; }
.faller { position: absolute; font-size: 30px; line-height: 1; transform: translate(-50%, -50%); pointer-events: none; }
.mem-grid { position: absolute; inset: 44px 12px 12px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; }
.mem {
  border: 0; border-radius: 12px; cursor: pointer; font-size: clamp(24px, 8vw, 34px); line-height: 1;
  background: #3f6b3a; color: transparent; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); transition: background .2s;
  display: grid; place-items: center; padding: 0; position: relative;
}
.mem::before { content: "?"; position: absolute; font-family: var(--font-display); color: rgba(255,255,255,.55); font-size: 26px; }
.mem.open, .mem.done { background: #fffdf7; color: inherit; }
.mem.open::before, .mem.done::before { content: none; }
.mem.done { opacity: .55; }
.mem.miss { animation: shake .3s; }

/* overlay card inside scene (naming, results) */
.card {
  position: absolute; inset: auto 12px 12px 12px; z-index: 10;
  background: var(--surface); color: var(--ink); border-radius: 18px; padding: 16px;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 24px); overflow-y: auto;
  animation: up .25s ease-out;
}
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
.record { display: inline-block; font-family: var(--font-display); color: #26241f; background: var(--gold); padding: 2px 8px; border-radius: 8px; font-size: 14px; margin-left: 6px; vertical-align: middle; }
.loot { display: flex; flex-wrap: wrap; gap: 8px; }
.loot .it { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 13px; background: var(--bg); }
.loot .it .g { font-size: 22px; }
.loot .it.new { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.row { display: flex; gap: 8px; }
.input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-family: var(--font-display); font-size: 17px; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .act:focus-visible, .icon-btn:focus-visible, .item:focus-visible, .input:focus-visible, .quest:focus-visible, .mem:focus-visible, .hog:focus-visible { outline: 3px solid var(--moss); outline-offset: 2px; }

/* ---------- quest strip ---------- */
.quests { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.quest {
  position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 9px 12px;
  display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; min-width: 0;
}
.quest .g { font-size: 22px; line-height: 1; flex: none; }
.quest .tx { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.quest .t { font-family: var(--font-display); font-size: 16px; line-height: 1; }
.quest .d { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.pips i.on { background: var(--moss); }
.pips i.claim { background: var(--gold); animation: pulse 1.2s infinite; }
.dot { position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }

/* ---------- gauges ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.stat { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-width: 0; }
.stat label { font-size: 13px; color: var(--muted); width: 3.4em; }
.stat .val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 2em; text-align: right; }
.stat .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.stat .bar > i { display: block; height: 100%; width: 50%; border-radius: inherit; background: var(--good); transition: width .5s, background .5s; }
.stat.mid .bar > i { background: var(--warn); }
.stat.low .bar > i { background: var(--bad); animation: pulse 1.2s infinite; }
.stat.low label { color: var(--bad); }
@keyframes pulse { 50% { opacity: .55; } }
.status-line { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.status-line:empty { display: none; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.alert { border-color: var(--bad); color: var(--bad); }
.chip.calm { border-color: var(--moss); color: var(--moss); }

/* ---------- action pad ---------- */
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act {
  position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 16px;
  padding: 10px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--font-display); font-size: 15px; transition: transform .1s, opacity .2s;
  touch-action: manipulation; box-shadow: inset 0 -3px 0 var(--line);
}
.act .g { font-size: 24px; line-height: 1; font-family: initial; }
.act:active { transform: scale(.95); }
.act:disabled { opacity: .38; cursor: default; }
.act.need::after { content: ""; position: absolute; top: 7px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.note { font-size: 13px; color: var(--muted); line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; padding-inline: 4px; margin: 0; }
.note b { font-family: var(--font-display); font-weight: 400; color: var(--moss); white-space: nowrap; font-size: 14px; }

/* ---------- sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(20, 18, 12, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 460px; max-height: 84%; overflow-y: auto;
  background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px; animation: up .25s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.sheet .sub { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.sheet .sec { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; }
.items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.items.one { grid-template-columns: 1fr; }
.item {
  border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left; cursor: pointer; min-width: 0;
}
.item .g { grid-row: span 2; font-size: 28px; line-height: 1; }
.item .t { font-family: var(--font-display); font-size: 17px; }
.item .d { font-size: 12px; color: var(--muted); min-width: 0; }
.item.static { cursor: default; }
.item:disabled { opacity: .45; cursor: default; }

.mission { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.mission .t { font-family: var(--font-display); font-size: 17px; }
.mission .bar { grid-column: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }

.mission .p { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mission .btn { grid-column: 2; grid-row: 1 / span 2; padding: 8px 12px; font-size: 15px; }
.mission.claimed { opacity: .55; }

.dex { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cell { aspect-ratio: 1; border-radius: 12px; background: var(--bg); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 24px; line-height: 1; position: relative; min-width: 0; }
.cell small { font-size: 9px; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline: 2px; }
.cell.unknown { font-family: var(--font-display); color: var(--muted); opacity: .6; font-size: 22px; }
.cell.r1 { border-color: var(--rare); }
.cell.r2 { border-color: var(--legend); }
.cell .n { position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 2px solid var(--line); vertical-align: -1px; margin-right: 4px; }
.legend .l1 i { border-color: var(--rare); } .legend .l2 i { border-color: var(--legend); }

.evo { text-align: center; align-items: center; }
.evo .pic { width: 140px; height: 140px; flex: none; animation: evo 1.2s ease-out; }
@keyframes evo { 0% { filter: brightness(4) saturate(0); transform: scale(.6); } 60% { filter: brightness(2) saturate(.3); transform: scale(1.1); } 100% { filter: none; transform: scale(1); } }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; transition: opacity .3s; }
.toast.hide { opacity: 0; pointer-events: none; }

@media (max-width: 370px) {
  .stats { grid-template-columns: 1fr; }
  .act { font-size: 13px; }
  .quests { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

PLACES.forEach((p) => p.finds.forEach(([id, g, name, r]) => { TREASURE[id] = { id, g, name, r, place: p.id }; }));

  { id: 'shop',    text: '상점에서 1번 사기',       goal: 1,  ev: 'buy' },
];

const UNLOCKS = {

  3: '새 놀이 "사과 받기"가 열렸어요!',
  4: '탐험 장소 "반짝 개울"이 열렸어요!',
  5: '새 놀이 "짝맞추기"가 열렸어요!',

  10: '탐험 장소 "무지개 꽃밭"이 열렸어요!',
  12: '진화할 시간이에요!',
};

const TIPS = [
  '진짜 고슴도치는 밤에 1~2km나 돌아다녀요. 야행성이라 밤에 놀면 열매가 1.5배!',
  '고슴도치 가시는 5천~7천 개. 사실 가시는 털이 딱딱하게 변한 거예요.',
  '도치를 너무 많이 콕콕 찌르면 몸을 동그랗게 말고 "후웁!" 해요.',
  'Lv.12가 되면 진화해요. 무엇을 제일 많이 해 줬는지에 따라 모습이 달라져요!',
  '전설 보물은 아주 가끔만 나와요. 도감 20칸을 다 채워 보세요.',

/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.max(0, Math.min(100, v));
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dayKey = (t) => new Date(t).toDateString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// XP needed to go from level l to l+1
const need = (l) => 15 + l * 10;
function levelOf(xp) {
  let l = 1, rest = xp;
  while (l < MAX_LV && rest >= need(l)) { rest -= need(l); l++; }
  return { lv: l, into: rest, span: l < MAX_LV ? need(l) : 0 };
}
const stageOf = (lv) => (lv >= EVOLVE_LV ? 2 : lv >= 5 ? 1 : 0);
const STAGES = [
  { name: '아기 고슴도치', scale: .66, spikes: 15 },
  { name: '꼬마 고슴도치', scale: .82, spikes: 19 },
  { name: '어른 고슴도치', scale: 1,   spikes: 23 },
];

function newState(name) {
  const now = Date.now();
  return migrate({
    v: 2, name, born: now, last: now,
    full: 62, happy: 70, clean: 85, energy: 78, health: 92,
    sleeping: false, sick: false,

    owned: [], wear: null,
    treats: { day: dayKey(now), n: 0 },

// Fill fields added after v1 so older saves keep working.
function migrate(s) {
  s.v = 2;
  s.counts = Object.assign({ feed: 0, play: 0, pet: 0, bath: 0, explore: 0 }, s.counts);

  s.treats = s.treats || { day: '', n: 0 };

}

let S = null;              // saved game state
let adopted = false;       // false while the naming card is shown
const T = { curlUntil: 0, eatUntil: 0, pokes: [], speakUntil: 0, nextChat: 0, game: null, lastKey: '', cardOpen: false };

function save() {

/* ================= sound ================= */
let actx = null;
const SFX = {
  tap:    [[620, .05]],
  pop:    [[760, .06], [1020, .06]],
  coin:   [[988, .07], [1319, .12]],
  bad:    [[200, .16, 'sawtooth'], [150, .2, 'sawtooth']],

  rare:   [[784, .08], [988, .08], [1175, .08], [1568, .25]],
  splash: [[500, .05], [700, .05], [900, .05]],
  win:    [[659, .1], [784, .1], [1047, .1], [784, .08], [1047, .3]],
};
function sfx(kind) {
  if (!S || !S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    let t = actx.currentTime;
    for (const [f, d, type] of SFX[kind] || []) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.18, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + d + .02);
      t += d * .9;
    }
  } catch (e) { /* audio unavailable */ }
}

/* ================= simulation ================= */
// Advance the world by `ms` milliseconds ending at time `now`. Pushes notable events into ev.
function step(s, ms, now, ev) {
  const h = ms / HOUR, np = s.poops.length;
  const fullRate = s.form === 'foodie' ? .6 : 1, happyRate = s.form === 'sweet' ? .6 : 1;
  if (s.sleeping) {
    s.full -= 4 * h * fullRate; s.energy += 34 * h; s.happy -= 1 * h; s.clean -= 2 * h;
  } else {
    s.full -= 10 * h * fullRate; s.energy -= (s.explore ? 0 : 8) * h;
    s.happy -= (6 + np * 5 + (s.full < 20 ? 8 : 0)) * h * happyRate;
    s.clean -= (5 + np * 4) * h;
  }
  const bad = (s.full < 15) + (s.clean < 20) + (np >= 3) + (s.energy < 8);
  if (bad) s.health -= 6 * bad * h;
  else if (s.full > 45 && s.clean > 45 && s.happy > 35) s.health += 4 * h;
  if (s.sick) { s.health -= 3 * h; s.happy -= 4 * h; }
  else if (s.health < 35 && Math.random() < ms / (40 * MIN)) { s.sick = true; ev.push('sick'); }

  if (!s.sleeping && !s.explore && now >= s.nextPoop) {
    if (s.full > 10 && s.poops.length < 6) { s.poops.push({ id: now + Math.random(), x: rand(30, 88) }); ev.push('poop'); }
    s.nextPoop = now + rand(40, 75) * MIN;
  }
  if (!s.sleeping && !s.explore && s.energy <= 0) { s.sleeping = true; ev.push('fellAsleep'); }
  if (s.sleeping && s.energy >= 100) { s.sleeping = false; ev.push('woke'); }
  for (const { k } of STATS) s[k] = clamp(s[k]);
}

function catchUp(s, until) {
  const ev = [];
  let t = Math.max(s.last, until - 72 * HOUR); // simulate at most three days away
  while (t < until) {
    const d = Math.min(MIN, until - t);
    t += d;
    step(s, d, t, ev);
  }
  s.last = until;
  return ev;
}

/* ================= hedgehog drawing ================= */
function spikeRing(cx, cy, rx, ry, n, len, a0, a1) {
  const pts = [];
  const total = n * 2;
  for (let i = 0; i <= total; i++) {
    const a = (a0 + (a1 - a0) * (i / total)) * Math.PI / 180;
    const r = i % 2 ? 1 + len : 1;
    pts.push((cx + Math.cos(a) * rx * r).toFixed(1) + ',' + (cy + Math.sin(a) * ry * r).toFixed(1));
  }
  return pts.join(' ');
}

/* ================= derived state ================= */
function moodOf(now) {
  if (T.curlUntil > now) return 'curl';
  if (S.sleeping) return 'sleep';
  if (T.eatUntil > now) return 'eat';
  if (S.sick) return 'sick';
  if (Math.min(S.full, S.happy, S.clean, S.energy) < 20) return 'sad';
  if (S.happy >= 75) return 'happy';
  return 'normal';
}
function timeOfDay(d = new Date()) {
  const h = d.getHours();
  if (h >= 5 && h < 7) return 'dawn';
  if (h >= 7 && h < 17) return 'day';
  if (h >= 17 && h < 19) return 'dusk';
  return 'night';
}
const isNight = () => timeOfDay() === 'night';
const lvNow = () => levelOf(S.xp).lv;

    hogInner.innerHTML = hogSvg(mood, stage, S.wear, S.form);

  set('clean', S.poops.length === 0, S.poops.length > 0);

  const sb = $('act-sleep');
  sb.querySelector('.l').textContent = asleep ? '깨우기' : '재우기';
  sb.querySelector('.g').textContent = asleep ? '☀️' : '🌙';
}

let bubbleTimer = 0;

function hogPos() {
  const r = hog.getBoundingClientRect(), s = scene.getBoundingClientRect();
  if (!r.width) return { x: 50, y: 50 };
  return { x: (r.left + r.width / 2 - s.left) / s.width * 100, y: (r.top - s.top) / s.height * 100 };
}
function floatText(text, dx = 0, big = false) {

function addXp(n) {
  const before = lvNow();

function levelUp(from, to) {
  sfx('up'); hop();

  for (let l = from + 1; l <= to; l++) { bonus += l * 3; if (UNLOCKS[l]) msgs.push(UNLOCKS[l]); }
  S.coins += bonus;
  toast(`Lv.${to} 달성! 열매 +${bonus}${msgs.length ? ' · ' + msgs[msgs.length - 1] : ''}`);
  say(pick(['레벨 업! 나 좀 강해진 듯?', '힘이 넘친다! 가시가 빳빳해!', '나 계속 클 거야!']), 3000);

}

/* ================= missions & streak ================= */
function ensureDaily() {
  const today = dayKey(Date.now());
  if (S.missions && S.missions.day === today) return;
  const lv = levelOf(S.xp).lv;
  const pool = MISSIONS.filter((m) => !m.lv || lv >= m.lv);
  S.missions = { day: today, bonus: false, list: shuffle(pool).slice(0, 3).map((m) => ({ id: m.id, goal: m.goal, prog: 0, claimed: false })) };
  if (adopted) checkStreak(today);
}
function checkStreak(today) {
  if (S.streak.day === today) return;
  const yesterday = dayKey(Date.now() - DAY);
  S.streak.n = S.streak.day === yesterday ? S.streak.n + 1 : 1;
  S.streak.day = today;
  const reward = 5 * Math.min(S.streak.n, 7);
  S.coins += reward;
  setTimeout(() => { toast(`출석 ${S.streak.n}일째! 열매 +${reward}`); sfx('coin'); }, 900);
}
function track(ev, value = 1) {
  if (!S.missions) return;
  let done = false;
  S.missions.list.forEach((m) => {
    const def = MISSIONS.find((d) => d.id === m.id);
    if (!def || def.ev !== ev || m.claimed || m.prog >= m.goal) return;
    m.prog = def.max ? Math.max(m.prog, value) : m.prog + value;
    if (m.prog >= m.goal) { m.prog = m.goal; done = true; }
  });
  if (done) setTimeout(() => { toast('미션 완료! 오늘의 미션에서 보상을 받아요'); sfx('coin'); }, 600);
}

function openMissions() {
  ensureDaily();
  const list = S.missions.list.map((m, i) => {
    const def = MISSIONS.find((d) => d.id === m.id);
    const ready = m.prog >= m.goal && !m.claimed;
    return `<div class="mission${m.claimed ? ' claimed' : ''}">
      <span class="t">${def.text}</span>
      <button class="btn" type="button" data-claim="${i}" ${ready ? '' : 'disabled'}>${m.claimed ? '받음' : ready ? '보상 받기' : `열매 ${MISSION_REWARD.coins}`}</button>
      <div class="bar"><i style="width:${(100 * m.prog / m.goal).toFixed(0)}%"></i></div>
      <span class="p">${def.max ? (m.prog >= m.goal ? '성공!' : `최고 ${m.prog} / ${m.goal}`) : `${m.prog} / ${m.goal}`}</span>

  }

  setTimeout(() => d.remove(), 1700);
  T.eatUntil = Date.now() + 1700;

function pet() {

function rollTreasure(p) {

function finishExplore() {

    S.dex[id] = (S.dex[id] || 0) + 1;
  }

  S.coins += berries;
  S.happy = clamp(S.happy + 8);
  S.counts.explore++;

  say(best === 2 ? '이거 봐! 전설의 보물이야!!!' : best === 1 ? '반짝반짝한 거 찾았어!' : '다녀왔어! 이것 좀 봐');
}

// 1) Mealworm hunt: tap worms, avoid bees, chain hits within 1s for combo multipliers.
function gameWorm() {
  const dur = S.form === 'athlete' ? 28000 : 25000;
  const area = gameShell(`<span>점수 <b id="gScore">0</b></span><span id="gTime">${dur / 1000}</span>`);
  const comboEl = document.createElement('div'); comboEl.className = 'combo'; area.appendChild(comboEl);
  const g = { score: 0, combo: 0, bestCombo: 0, lastHit: 0, start: Date.now(), timers: new Set() };
  g.end = g.start + dur;
  const later = (fn, ms) => { const t = setTimeout(() => { g.timers.delete(t); fn(); }, ms); g.timers.add(t); };
  g.stop = () => { g.timers.forEach(clearTimeout); clearInterval(g.tick); };
  T.game = g;
  comboEl.textContent = '밀웜을 콕! 벌은 누르지 마!';
  const spawn = () => {
    if (T.game !== g) return;
    const t = Math.min(1, (Date.now() - g.start) / dur); // 0..1, game speeds up
    const r = Math.random();
    const kind = r < .14 ? 'bee' : r < .24 ? 'gold' : 'worm';
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'target' + (kind === 'gold' ? ' gold' : '');
    el.setAttribute('aria-label', kind === 'bee' ? '벌 (누르지 마세요)' : kind === 'gold' ? '황금 밀웜' : '밀웜');
    el.style.left = rand(3, 82) + '%'; el.style.top = rand(16, 76) + '%';
    el.innerHTML = kind === 'bee' ? '🐝' : wormSvg();
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (el.classList.contains('got') || T.game !== g) return;
      el.classList.add('got');
      const now = Date.now();
      if (kind === 'bee') {
        g.score = Math.max(0, g.score - 5); g.combo = 0;
        area.classList.remove('shake'); void area.offsetWidth; area.classList.add('shake');
        sfx('bad'); comboEl.textContent = '앗 따가워! -5';
      } else {
        g.combo = now - g.lastHit < 1000 ? g.combo + 1 : 1;
        g.lastHit = now;
        g.bestCombo = Math.max(g.bestCombo, g.combo);
        const mult = 1 + Math.floor(g.combo / 5);
        g.score += (kind === 'gold' ? 3 : 1) * mult;
        sfx(kind === 'gold' ? 'coin' : 'tap');
        comboEl.textContent = g.combo >= 3 ? `${g.combo} 콤보!${mult > 1 ? ` ×${mult}` : ''}` : '';
      }
      $('gScore').textContent = g.score;
      later(() => el.remove(), 260);
    });
    area.appendChild(el);
    const life = kind === 'gold' ? 800 : kind === 'bee' ? 1500 : 1500 - t * 600;
    later(() => { if (!el.classList.contains('got')) { el.remove(); if (kind !== 'bee') { g.combo = 0; comboEl.textContent = ''; } } }, life);
    later(spawn, rand(520, 820) - t * 300);
  };
  spawn();
  g.tick = setInterval(() => {
    const left = g.end - Date.now();
    const el = $('gTime'); if (el) el.textContent = Math.max(0, Math.ceil(left / 1000));
    if (left <= 0) {
      track('worm', g.score); track('combo', g.bestCombo);
      finishGame('worm', g.score, { title: `${g.score}점!`, line: `최고 콤보 ${g.bestCombo}.` });
    }
  }, 150);
}

// 2) Fruit catch: drag (or arrow keys) to move the hedgehog; rocks cost a heart.
function gameCatch() {
  const area = gameShell(`<span>점수 <b id="gScore">0</b> · <span id="gLives">❤️❤️❤️</span></span><span id="gTime">30</span>`);
  const catcher = document.createElement('div');
  catcher.className = 'catcher';
  catcher.innerHTML = hogSvg('happy', stageOf(lvNow()), S.wear, S.form);
  area.appendChild(catcher);
  const ITEMS = [{ g: '🍎', pts: 1, w: 50 }, { g: '🍓', pts: 2, w: 22 }, { g: '🐛', pts: 3, w: 10 }, { g: '🪨', pts: -1, w: 18 }];
  const g = { score: 0, lives: 3, x: 50, target: 50, items: [], start: performance.now(), last: performance.now(), nextSpawn: 0, raf: 0, done: false };
  const onKey = (e) => { if (e.key === 'ArrowLeft') g.target = Math.max(8, g.target - 12); if (e.key === 'ArrowRight') g.target = Math.min(92, g.target + 12); };
  g.stop = () => { cancelAnimationFrame(g.raf); window.removeEventListener('keydown', onKey); };
  T.game = g;
  const setTarget = (clientX) => { const r = area.getBoundingClientRect(); g.target = Math.max(8, Math.min(92, (clientX - r.left) / r.width * 100)); };
  area.addEventListener('pointerdown', (e) => setTarget(e.clientX));
  area.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) setTarget(e.clientX); });
  window.addEventListener('keydown', onKey);
  const hint = document.createElement('div'); hint.className = 'combo'; hint.textContent = '끌어서 움직여! 돌멩이는 피하기'; area.appendChild(hint);
  setTimeout(() => hint.remove(), 2500);
  const weighted = () => { let r = Math.random() * 100; for (const it of ITEMS) { if ((r -= it.w) < 0) return it; } return ITEMS[0]; };
  const end = (why) => {
    if (g.done) return; g.done = true;
    track('catch', g.score);
    finishGame('catch', g.score, { title: `${g.score}점!`, line: why });
  };
  const frame = (now) => {
    if (T.game !== g) return;
    const dt = Math.min(50, now - g.last) / 1000; g.last = now;
    const el = (now - g.start) / 1000;
    const left = 30 - el;
    $('gTime').textContent = Math.max(0, Math.ceil(left));
    if (left <= 0) return end('시간 끝!');
    g.x += (g.target - g.x) * Math.min(1, dt * 12);
    catcher.style.left = g.x + '%';
    if (now >= g.nextSpawn) {
      const it = weighted();
      const node = document.createElement('div'); node.className = 'faller'; node.textContent = it.g;
      area.appendChild(node);
      g.items.push({ it, node, x: rand(8, 92), y: -5, v: rand(28, 38) + el * 1.6 });
      g.nextSpawn = now + Math.max(330, 850 - el * 18);
    }
    for (const f of g.items) {
      f.y += f.v * dt;
      f.node.style.left = f.x + '%'; f.node.style.top = f.y + '%';
      if (!f.gone && f.y > 80 && f.y < 92 && Math.abs(f.x - g.x) < 10) {
        f.gone = true; f.node.remove();
        if (f.it.pts < 0) {
          g.lives--; sfx('bad');
          area.classList.remove('shake'); void area.offsetWidth; area.classList.add('shake');
          $('gLives').textContent = '❤️'.repeat(Math.max(0, g.lives)) + '🤍'.repeat(3 - Math.max(0, g.lives));
          if (g.lives <= 0) return end('돌멩이에 3번 맞았어요.');
        } else { g.score += f.it.pts; sfx('tap'); $('gScore').textContent = g.score; }
      } else if (!f.gone && f.y > 104) { f.gone = true; f.node.remove(); }
    }
    g.items = g.items.filter((f) => !f.gone);
    g.raf = requestAnimationFrame(frame);
  };
  g.raf = requestAnimationFrame(frame);
}

// 3) Memory: find 6 pairs as fast as possible.
function gameMemory() {
  const area = gameShell(`<span>짝 <b id="gScore">0</b> / 6</span><span id="gTime">0초</span>`);
  const pool = ['🍎', '🍓', '🐛', '🌰', '🍄', '🐞', '🐚', '🐸', '💎', '🦉', '🌼', '🦋'];
  const faces = shuffle(shuffle(pool).slice(0, 6).flatMap((f) => [f, f]));
  const grid = document.createElement('div'); grid.className = 'mem-grid';
  grid.innerHTML = faces.map((f, i) => `<button class="mem" type="button" data-i="${i}" aria-label="카드 ${i + 1}">${f}</button>`).join('');
  area.appendChild(grid);
  const g = { start: Date.now(), open: [], pairs: 0, lock: false, flips: 0, timers: [] };
  g.stop = () => { clearInterval(g.tick); g.timers.forEach(clearTimeout); };
  T.game = g;
  g.tick = setInterval(() => { const el = $('gTime'); if (el) el.textContent = Math.floor((Date.now() - g.start) / 1000) + '초'; }, 250);
  grid.addEventListener('click', (e) => {
    const b = e.target.closest('.mem');
    if (!b || g.lock || T.game !== g || b.classList.contains('open') || b.classList.contains('done')) return;
    b.classList.add('open'); sfx('tap'); g.open.push(b);
    if (g.open.length < 2) return;
    g.flips++;
    const [a, c] = g.open;
    if (faces[a.dataset.i] === faces[c.dataset.i]) {
      g.open = [];
      g.timers.push(setTimeout(() => { a.classList.replace('open', 'done'); c.classList.replace('open', 'done'); }, 250));
      g.pairs++; $('gScore').textContent = g.pairs; sfx('pop');
      if (g.pairs === 6) {
        g.lock = true;
        const secs = Math.max(1, Math.round((Date.now() - g.start) / 1000));
        if (secs <= 40) track('memoryFast');
        const coins = Math.max(4, 30 - Math.floor(secs / 3));
        g.timers.push(setTimeout(() => finishGame('memory', secs, { cleared: true, coins, title: `${secs}초 만에 성공!`, line: `카드를 ${g.flips}번 뒤집었어요.` }), 500));
      }
    } else {
      g.lock = true;
      g.timers.push(setTimeout(() => { a.classList.remove('open'); c.classList.remove('open'); a.classList.add('miss'); c.classList.add('miss'); g.open = []; g.lock = false; }, 700));
      g.timers.push(setTimeout(() => { a.classList.remove('miss'); c.classList.remove('miss'); }, 1100));
    }
  });
}

/* ================= sheets ================= */
const sheetWrap = $('sheetWrap'), sheet = $('sheet');
function openSheet(html) { sheet.innerHTML = html; sheetWrap.hidden = false; }
function closeSheet() { sheetWrap.hidden = true; sheet.innerHTML = ''; }
sheetWrap.addEventListener('click', (e) => { if (e.target === sheetWrap) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheetWrap.hidden) closeSheet(); });

function openFeed() {
  if (S.sleeping || S.explore) return;
  const items = Object.entries(FOODS).map(([k, f]) => {
    const have = f.price === 0 ? '무제한' : `${S.inv[k] || 0}개`;
    const dis = f.price > 0 && !S.inv[k];
    return `<button class="item" type="button" data-food="${k}" ${dis ? 'disabled' : ''}>
      <span class="g">${f.g}</span><span class="t">${f.name}</span><span class="d">${have} · 배부름 +${f.full} · 기분 +${f.happy}</span></button>`;
  }).join('');
  openSheet(`<h3>뭘 먹일까?</h3><p class="sub">배부름 ${Math.round(S.full)} / 100. 간식(딸기·밀웜)은 하루 4개까지! 더 주면 배탈 나요.</p>
    <div class="items">${items}</div>
    <div class="sheet-actions"><button class="btn ghost" type="button" data-close>닫기</button><button class="btn ghost" type="button" data-shop>상점 가기</button></div>`);
  sheet.querySelectorAll('[data-food]').forEach((b) => b.addEventListener('click', () => feed(b.dataset.food)));
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelector('[data-shop]').addEventListener('click', openShop);
}

function openShop() {
  const food = Object.entries(FOODS).filter(([, f]) => f.price > 0).map(([k, f]) =>
    `<button class="item" type="button" data-buy="${k}" ${S.coins < f.price ? 'disabled' : ''}>
      <span class="g">${f.g}</span><span class="t">${f.name} · 열매 ${f.price}</span><span class="d">${f.desc} (${S.inv[k] || 0}개 있음)</span></button>`).join('');
  const gear = Object.entries(GEAR).map(([k, g]) => {
    const owned = S.owned.includes(k), on = S.wear === k;
    const d = on ? '착용 중 · 눌러서 벗기' : owned ? '눌러서 착용' : `열매 ${g.price}`;
    return `<button class="item${on ? ' on' : ''}" type="button" data-gear="${k}" ${!owned && S.coins < g.price ? 'disabled' : ''}>
      <span class="g">${g.g}</span><span class="t">${g.name}</span><span class="d">${d}</span></button>`;
  }).join('');
  openSheet(`<h3>숲속 상점</h3><p class="sub">가진 열매 ${S.coins}개. 열매는 놀이, 탐험, 미션, 출석으로 모아요.</p>
    <div class="sec">먹이</div><div class="items">${food}</div>
    <div class="sec">꾸미기</div><div class="items">${gear}</div>
    <div class="sheet-actions"><button class="btn ghost" type="button" data-close>닫기</button></div>`);
  sheet.querySelectorAll('[data-buy]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.buy, f = FOODS[k];
    if (S.coins < f.price) return;
    S.coins -= f.price; S.inv[k] = (S.inv[k] || 0) + 1;
    sfx('coin'); toast(`${f.name} 1개를 샀어요`); track('buy');
    save(); render(); openShop();
  }));
  sheet.querySelectorAll('[data-gear]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.gear, g = GEAR[k];
    if (!S.owned.includes(k)) {
      if (S.coins < g.price) return;
      S.coins -= g.price; S.owned.push(k); S.wear = k;
      sfx('coin'); toast(`${g.name}을(를) 샀어요`); track('buy');
      say('어때? 나 좀 멋있지?');
    } else {
      S.wear = S.wear === k ? null : k;
      sfx('pop');
    }
    save(); render(); openShop();
  }));
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
}

function openMenu() {
  const age = Math.floor((Date.now() - S.born) / HOUR);
  const dexN = Object.keys(S.dex).length;
  openSheet(`<h3>${esc(S.name)}의 기록</h3>

      <div class="item static"><span class="g">📅</span><span class="t">${age < 24 ? age + '시간' : Math.floor(age / 24) + '일'}</span><span class="d">함께한 시간</span></div>
      <div class="item static"><span class="g">🔥</span><span class="t">${S.streak.n}일</span><span class="d">연속 출석</span></div>
      <div class="item static"><span class="g">🐛</span><span class="t">${S.best.worm}점</span><span class="d">밀웜 사냥 최고</span></div>
      <div class="item static"><span class="g">🍎</span><span class="t">${S.best.catch}점</span><span class="d">사과 받기 최고</span></div>
      <div class="item static"><span class="g">🃏</span><span class="t">${S.best.memory ? S.best.memory + '초' : '-'}</span><span class="d">짝맞추기 최고</span></div>
      <div class="item static"><span class="g">📖</span><span class="t">${dexN} / ${DEX_TOTAL}</span><span class="d">보물 도감</span></div>
    </div>
    <div class="sec">이름 바꾸기</div>

    <div class="sec">처음부터 다시</div>

    <div class="sheet-actions"><button class="btn ghost" type="button" data-close>닫기</button><button class="btn ghost" type="button" id="resetBtn">새로 시작하기</button></div>`);
  $('renameForm').addEventListener('submit', (e) => {

    const b = $('resetBtn');

    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }

$('menuBtn').addEventListener('click', () => { if (adopted) openMenu(); });

function showReport(ev, awayMs) {
  const lines = [];
  const n = (k) => ev.filter((e) => e === k).length;
  if (n('poop')) lines.push(`응가를 ${n('poop')}번 했어요.`);
  if (n('fellAsleep')) lines.push('지쳐서 혼자 잠들었어요.');
  if (n('woke')) lines.push('푹 자고 스스로 일어났어요.');
  if (n('sick')) lines.push('몸이 아파졌어요. 약을 먹여 주세요.');
  if (S.explore && S.explore.end <= Date.now()) lines.push('탐험에서 돌아와 보물을 보여 주고 싶어해요!');
  if (S.full < 30) lines.push('배가 많이 고파요.');
  if (S.clean < 30) lines.push('씻고 싶어해요.');
  if (!lines.length) lines.push('얌전히 잘 기다렸어요.');
  const h = Math.floor(awayMs / HOUR), m = Math.floor((awayMs % HOUR) / MIN);
  openSheet(`<h3>왔구나! 보고 싶었어!</h3><p class="sub">${h ? h + '시간 ' : ''}${m}분 동안 ${esc(S.name)}에게 있었던 일</p>
    <ul class="report">${lines.map((l) => `<li>${l}</li>`).join('')}</ul>
    <div class="sheet-actions"><button class="btn" type="button" data-close>돌보러 가기</button></div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
}

/* ================= touch on hedgehog ================= */
hog.addEventListener('click', () => { if (adopted && !T.game) pet(); });
hog.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && adopted) { e.preventDefault(); pet(); } });

/* ================= ambient chatter ================= */
function chatter(now) {
  if (now < T.nextChat || now < T.speakUntil || T.game || S.explore || !sheetWrap.hidden || T.cardOpen) return;
  T.nextChat = now + rand(11000, 18000);
  if (S.sleeping) return;
  let line;
  if (S.sick) line = '으슬으슬… 약 좀 줘…';
  else if (S.poops.length >= 2) line = pick(['여기 냄새 실화야? 응가 좀 치워 줘!', '응가 밟을 것 같아…']);
  else if (S.full < 30) line = pick(['배고파서 가시가 축 처졌어…', '꼬르륵… 밀웜이 눈앞에 보여…', '밥! 밥! 밥!']);
  else if (S.energy < 25) line = '졸려… 눈이 자꾸 감겨…';
  else if (S.clean < 30) line = '나한테서 숲 냄새… 아니 이상한 냄새 나';
  else if (S.happy < 30) line = pick(['심심해! 놀이 한 판 하자!', '나랑 대결할래?']);
  else if (S.missions && S.missions.list.some((m) => m.prog >= m.goal && !m.claimed)) line = '미션 보상 받을 거 있어! 오늘의 미션 눌러 봐!';
  else line = isNight() ? pick(['밤이다! 이제 내 시간이야!', '고슴도치는 밤에 더 쌩쌩하다고!', '탐험 가기 딱 좋은 밤이네'])
                        : pick(['내 가시 오늘 좀 멋있지 않아?', '탐험 가고 싶다~', '나 밀웜 사냥 신기록 깰 수 있어!', '킁킁, 어디서 맛있는 냄새…', '심심한데 날 콕 찔러 봐. 살살!']);
  say(line);
}

/* zzz bubbles while sleeping */
setInterval(() => {
  if (!adopted || !S.sleeping) return;
  const z = document.createElement('div'); z.className = 'zzz';
  const p = hogPos(); z.style.left = `calc(${p.x}% + ${rand(10, 40)}px)`; z.style.top = `calc(${p.y}% + 10px)`;
  z.textContent = 'z'; z.style.fontSize = rand(14, 24) + 'px';
  $('fx').appendChild(z); setTimeout(() => z.remove(), 3000);
}, 1400);

/* ================= main loop ================= */
let saveCount = 0;
function tick() {
  if (!adopted) return;
  const now = Date.now();
  const ev = [];
  step(S, Math.max(0, now - S.last), now, ev);
  S.last = now;
  if (ev.includes('poop')) say('앗… 응가했다. 헤헤', 2200);
  if (ev.includes('sick')) { say('몸이 이상해… 으슬으슬…', 3000); sfx('bad'); }
  if (ev.includes('fellAsleep')) say('너무 피곤해서… 쿨…', 2500);
  if (ev.includes('woke')) { say('잘 잤다! 충전 100%!'); hop(); }
  if (S.explore && now >= S.explore.end && !T.game && !T.cardOpen) finishExplore();
  else if (!S.form && lvNow() >= EVOLVE_LV && !S.explore && !S.sleeping && !T.game && !T.cardOpen && sheetWrap.hidden) evolve();
  chatter(now);
  render();
  if (++saveCount % 5 === 0) save();
}

/* ================= adoption ================= */
function showAdoption() {
  adopted = false;
  S = newState('도치');
  ensureDaily();
  T.lastKey = '';
  renderSoundBtn();
  render();
  T.cardOpen = true;
  $('overlay').innerHTML = `<form class="card" id="adoptForm">
    <h2>숲에서 아기 고슴도치를 발견했다!</h2>
    <p>같이 살면서 키우고, 놀고, 탐험을 떠나 보자. 이름을 지어 줘!</p>
    <div class="row"><input class="input" id="adoptName" maxlength="10" value="도치" aria-label="고슴도치 이름" autocomplete="off"><button class="btn" type="submit">함께 살기</button></div>
  </form>`;
  $('adoptForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('adoptName').value.trim() || '도치';
    S = newState(name);
    adopted = true;
    ensureDaily();
    T.lastKey = ''; closeCard();
    sfx('win');
    save(); render(); hop();
    say(`안녕! 나는 ${name}! 날 콕 찔러서 쓰다듬어 줘`, 4000);
  });
}

function start(data) {
  const fromHot = data && data.S;
  const saved = fromHot ? data.S : load();
  if (saved && (saved.v === 1 || saved.v === 2)) {
    S = migrate(saved);
    adopted = true;
    const away = Date.now() - S.last;
    const ev = catchUp(S, Date.now());
    renderSoundBtn();
    render(); save();
    if (!fromHot && away > 20 * MIN) showReport(ev, away);
    else say(`${S.name} 등장!`);
  } else {
    showAdoption();
  }
  setInterval(tick, 1000);
  wander();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else tick(); });
  window.addEventListener('pagehide', save);
}

if (window.claude?.hot) window.claude.hot.snapshot?.(() => ({ S: adopted ? S : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
