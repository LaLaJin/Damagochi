<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4e6b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>우리 집 고슴도치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column like a pet-care journal. Room scene on top, live readings, condition list, care actions, then the observation log. */
:root {
  --bg: #f2f0eb;
  --surface: #ffffff;
  --ink: #2a2926;
  --muted: #74706a;
  --line: #e1ddd4;
  --accent: #4e6b4a;      /* moss: primary actions, good state */
  --accent-ink: #ffffff;
  --warn: #b7791f;
  --bad: #b4483c;
  --shadow: 0 1px 2px rgba(42, 41, 38, .06), 0 8px 24px -16px rgba(42, 41, 38, .35);
  --font-head: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1a; --surface: #252623; --ink: #ecebe6; --muted: #a3a097; --line: #383934;
    --accent: #8fb487; --accent-ink: #1b1c1a; --warn: #e0a84a; --bad: #e57b6c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1a; --surface: #252623; --ink: #ecebe6; --muted: #a3a097; --line: #383934;
  --accent: #8fb487; --accent-ink: #1b1c1a; --warn: #e0a84a; --bad: #e57b6c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-inline: 16px; padding-block: 14px 28px;
}
button { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: flex-end; gap: 12px; }
.who { flex: 1; min-width: 0; }
.name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rename { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.rename:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.meta { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.icon-btn { flex: none; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--muted); }

/* scene */
.scene { position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #e8e2d8; user-select: none; -webkit-user-select: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.scene.holding .cap { display: none; }
.fade { position: absolute; inset: 0; z-index: 6; background: #f6f3ec; display: grid; place-items: center; color: #4a463f; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .6s; }
.fade.on { opacity: 1; }
.act.fired { animation: fired .8s ease-out; }
@keyframes fired { 0% { box-shadow: 0 0 0 0 var(--accent); border-color: var(--accent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #5d574e; font-size: 13px; }
.sw { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 -3px 6px rgba(0,0,0,.25); }
.cap { position: absolute; left: 10px; top: 10px; right: 100px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.cap span { background: rgba(28, 27, 24, .62); color: #f5f3ee; font-size: 12px; padding: 3px 9px; border-radius: 99px; backdrop-filter: blur(4px); font-variant-numeric: tabular-nums; }
.zoom { position: absolute; right: 10px; top: 10px; border: 0; border-radius: 99px; padding: 4px 11px; font-size: 12px; background: rgba(28, 27, 24, .62); color: #f5f3ee; cursor: pointer; }
.zoom:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#hogG { transition: transform 2.6s linear; }
#hogG.jump { transition: none; }
#hogG svg, .hand-hog svg { overflow: visible; }
.legs rect { transform-box: fill-box; }
.walking .legs rect { animation: step .32s infinite alternate ease-in-out; }
.running .legs rect { animation: step .14s infinite alternate linear; }
.walking .legs rect:nth-child(2), .running .legs rect:nth-child(2) { animation-direction: alternate-reverse; }
@keyframes step { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
.sniff { transform-box: fill-box; transform-origin: left center; animation: sniff 1.8s infinite; }
@keyframes sniff { 0%, 62%, 100% { transform: none; } 70% { transform: translate(1.5px, -1px) scale(1.08); } 78% { transform: none; } 86% { transform: translate(1.5px, -1px) scale(1.08); } }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(.1); } }
.breathe { transform-box: fill-box; transform-origin: center bottom; animation: breathe 3.8s infinite ease-in-out; }
@keyframes breathe { 50% { transform: scale(1.02, .975); } }
.shiver { animation: shiver .14s infinite; }
@keyframes shiver { 50% { transform: translateX(1px); } }
.spin { transform-origin: 330px 196px; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.munch { transform-box: fill-box; transform-origin: center top; animation: munch .35s infinite; }
@keyframes munch { 50% { transform: scaleY(.4); } }
.foam { animation: foam 1.2s infinite alternate; }
@keyframes foam { to { opacity: .5; } }

/* handling overlay */
.hand { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.hand-stage { position: absolute; inset: 0 0 64px; }
.hand-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hand-say { position: relative; margin: 10px 12px 0; color: #f2efe8; font-size: 13px; text-align: center; line-height: 1.45; background: rgba(0,0,0,.35); border-radius: 10px; padding: 6px 10px; }
.hand-bar { position: relative; display: flex; gap: 6px; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,.45)); pointer-events: auto; }
.hand-bar button { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 9px 4px; font-size: 13px; font-weight: 500; cursor: pointer; background: #f2efe8; color: #2a2926; }
.hand-bar button.done { background: #4e6b4a; color: #fff; }
.hand-bar button:disabled { opacity: .45; cursor: default; }

/* readings */
.vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.vital { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; min-width: 0; }
.vital .k { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.vital .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.vital .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.vital .n { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vital.warn .n { color: var(--warn); } .vital.bad .n { color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.panel h2 { margin: 0 0 8px; font-family: var(--font-head); font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 small { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); }
.cond { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.c { display: grid; grid-template-columns: 4.6em 1fr auto; align-items: center; gap: 8px; min-width: 0; }
.c label { font-size: 13px; color: var(--muted); }
.c .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.c .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s; }
.c .w { font-size: 12px; min-width: 2.4em; text-align: right; }
.c.warn .bar i { background: var(--warn); } .c.warn .w { color: var(--warn); }
.c.bad .bar i { background: var(--bad); } .c.bad .w { color: var(--bad); font-weight: 700; }
.alerts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.alerts:empty { display: none; }
.alerts span { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.alerts span.bad { border-color: var(--bad); color: var(--bad); }
.alerts span.warn { border-color: var(--warn); color: var(--warn); }

.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 6px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; position: relative; }
.act b { font-weight: 500; font-size: 13px; line-height: 1.3; }
.act span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.need { border-color: var(--warn); }
.act.need span { color: var(--warn); }
.act.urgent { border-color: var(--bad); }
.act.urgent span { color: var(--bad); }
.act:active { transform: scale(.97); }
.act:disabled { opacity: .4; cursor: default; }
.act:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .opt:focus-visible, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 3.6em 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.log li.bad span { color: var(--bad); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 0; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(20, 19, 16, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 86%; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--font-head); font-size: 21px; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .sec { font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-top: 4px; }
.sheet ul { margin: 0; padding-left: 1.1em; line-height: 1.75; }
.sheet dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.sheet dt { color: var(--muted); }
.sheet dd { margin: 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 500; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad); color: #fff; }
.input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; min-width: 0; }
.opt svg { width: 100%; height: auto; aspect-ratio: 1.2; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.picks { display: flex; flex-direction: column; gap: 8px; }
.pick { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: left; min-width: 0; }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick .sw { flex: none; }
.pick .pt { display: flex; flex-direction: column; min-width: 0; }
.pick .pt b { font-family: var(--font-head); font-size: 17px; }
.pick .pt span { font-size: 12px; color: var(--muted); }
.pick .pt span.need { color: var(--warn); }
.big-read { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.big-read small { font-size: 18px; color: var(--muted); font-weight: 500; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); text-align: center; transition: opacity .3s; }
.toast.hide { opacity: 0; pointer-events: none; }

@media (max-width: 400px) {
  .vitals { grid-template-columns: 1fr 1fr; }
  .cond { grid-template-columns: 1fr; }
  .acts { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="who">
      <div class="name-row"><h1 class="name" id="name">도치</h1><button class="rename" id="renameBtn" type="button" aria-label="이름 바꾸기">✎ 이름 바꾸기</button></div>
      <p class="meta" id="meta">아프리카 피그미 고슴도치</p>
    </div>
    <button class="icon-btn" id="menuBtn" type="button">기록 · 가이드</button>
  </header>

  <section class="scene" id="scene" aria-label="고슴도치가 사는 방">
    <canvas id="gl" aria-label="고슴도치 방 3D 화면. 끌어서 돌려 보고, 두 손가락이나 휠로 확대해요."></canvas>
    <div class="nogl" id="nogl" hidden>이 기기에서는 3D 화면을 표시할 수 없어요. 돌보기와 기록은 그대로 쓸 수 있어요.</div>
    <div class="cap"><span id="capTime">--:--</span><span id="capAct">관찰 중</span></div>
    <button class="zoom" id="zoomBtn" type="button">따라가며 보기</button>
    <div id="overlay"></div>
    <div class="fade" id="fade"><span></span></div>
  </section>

  <section class="vitals" aria-label="측정값">
    <div class="vital" id="vWeight"><div class="k">체중</div><div class="v">-</div><div class="n">-</div></div>
    <div class="vital" id="vTemp"><div class="k">케이지 온도</div><div class="v">-</div><div class="n">-</div></div>
    <div class="vital" id="vFood"><div class="k">사료 그릇</div><div class="v">-</div><div class="n">-</div></div>
    <div class="vital" id="vWater"><div class="k">물그릇</div><div class="v">-</div><div class="n">-</div></div>
  </section>

  <section class="panel" aria-label="상태">
    <h2>상태 <small id="condNote"></small></h2>
    <div class="cond" id="cond"></div>
    <div class="alerts" id="alerts"></div>
  </section>

  <section class="acts" id="acts" aria-label="돌보기"></section>

  <section class="panel">
    <h2>관찰 일지 <small id="nightNote"></small></h2>
    <ul class="log" id="log"></ul>
  </section>

  <p class="foot">고슴도치의 나이는 현실의 하루가 1주처럼 흘러요. 행동 시간은 실제 시계를 따라요.</p>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast hide" id="toast"></div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';

/* ================= constants ================= */
const SAVE_KEY = 'hedgehog-home-v1';
const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const BOWL_FOOD = 25, BOWL_WATER = 150, TREAT_LIMIT = 3;

/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dayKey = (t) => new Date(t).toDateString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hhmm = (t) => { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const hourOf = (t) => { const d = new Date(t); return d.getHours() + d.getMinutes() / 60; };
const isNight = (t) => { const h = hourOf(t); return h >= 19 || h < 7; };

// Room temperature follows the time of day; the ceramic heater adds about 4.5 °C.
const roomTemp = (t) => 21 + 1.6 * Math.sin((hourOf(t) - 9) / 24 * Math.PI * 2);
const cageTemp = (s, t) => roomTemp(t) + (s.heater ? 4.5 : 0);
// Age runs at one week per real day, starting from 8 weeks old on adoption day.
const ageWeeks = (s, t = Date.now()) => 8 + (t - s.adopted) / DAY;
const targetWeight = (w) => (w < 26 ? 150 + (w - 8) * (230 / 18) : 380);
const ageText = (w) => (w < 26 ? `생후 ${Math.floor(w)}주` : w < 52 ? `생후 ${Math.floor(w / 4.345)}개월` : `${Math.floor(w / 52)}살 ${Math.floor((w % 52) / 4.345)}개월`);

/* ================= coat colours ================= */
function seeded(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// African pygmy hedgehog colour morphs.
const COATS = {
  sp:        { label: '솔트앤페퍼', dark: '#3b2b20', mid: '#8a6a4f', band: '#3f2d21', tip: '#efe4d0', face: '#dccab0', mask: '#6e5745', belly: '#ebe0cf', skin: '#c99484', eye: '#120c09' },
  cinnamon:  { label: '시나몬',     dark: '#6e4325', mid: '#b98352', band: '#7a4a2a', tip: '#f8e6c8', face: '#eadac0', mask: '#a5784f', belly: '#f1e6d4', skin: '#d39c86', eye: '#120c09' },
  chocolate: { label: '초콜릿',     dark: '#2a1d15', mid: '#5e4230', band: '#2e2018', tip: '#e3d3b8', face: '#cdb497', mask: '#4f3c2e', belly: '#dccbb4', skin: '#b98a78', eye: '#120c09' },
  albino:    { label: '알비노',     dark: '#ddd2c8', mid: '#f5eee8', band: '#e3d7cd', tip: '#ffffff', face: '#f7ece4', mask: '#efdfd4', belly: '#f8f1ea', skin: '#efb3aa', eye: '#a32a3d' },
};

const swatch = (c) => `<span class="sw" style="background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.35), transparent 40%), repeating-conic-gradient(${c.mid} 0 9deg, ${c.dark} 9deg 17deg, ${c.tip} 17deg 21deg)"></span>`;

/* ================= state ================= */
function newState(name, sex, morph) {
  const now = Date.now();
  return {
    v: 1, id: 'h' + now.toString(36) + Math.floor(Math.random() * 1e6).toString(36), name, sex, morph, adopted: now, last: now,
    weight: rand(140, 158), satiety: 70, hydration: 72,
    food: 20, water: 120, dirt: 6, nails: 18, trust: 15, health: 92,
    heater: true, cold: 0, torpor: false, mites: false, feetDirty: false,
    act: 'sleep', actUntil: 0, sess: null,
    poops: [], shed: [], lastBedding: now, lastBath: now - 10 * DAY,
    treats: { day: dayKey(now), n: 0 },
    tot: { wheel: 0, food: 0, water: 0, poops: 0 },
    night: { key: '', wheel: 0 },
    flags: {}, weights: [], log: [],

function poseHog(h, pose, t, dt) {
  const curled = pose === 'ball' || pose === 'sleep';
  h.stand.visible = !curled; h.ball.visible = curled;
  h.raised.visible = pose === 'huff'; h.lying.visible = pose !== 'huff';
  h.foam.visible = pose === 'ant';
  const walk = pose === 'walk', run = pose === 'run';
  const f = run ? 26 : 11, amp = run ? .75 : walk ? .5 : 0;
  h.legs.forEach((g) => { const w = Math.sin(t * f + g.userData.ph); g.position.x = g.userData.bx + amp * .09 * w; g.position.y = .06 + Math.max(0, w) * amp * .06; });
  h.stand.position.y = walk || run ? Math.abs(Math.sin(t * f)) * (run ? .035 : .02) : 0;
  h.stand.position.x = pose === 'huff' ? Math.sin(t * 38) * .012 : 0;
  let pitch = 0, yaw = 0;
  if (pose === 'eat' || pose === 'drink') pitch = -.5 + Math.sin(t * 9) * .07;
  else if (pose === 'huff') pitch = -.28;
  else if (pose === 'ant') { yaw = 1.25; pitch = .3 + Math.sin(t * 6) * .08; }
  else if (pose === 'stand') { pitch = Math.sin(t * 1.3) * .1 + .04; yaw = Math.sin(t * .6) * .35; }
  else if (walk) pitch = Math.sin(t * 2.2) * .06 - .05;
  pitch *= h.pitchK || 1; yaw *= h.yawK || 1;
  h.head.rotation.z += (pitch - h.head.rotation.z) * Math.min(1, dt * 6);
  h.head.rotation.y += (yaw - h.head.rotation.y) * Math.min(1, dt * 4);
  const sn = 1 + (pose === 'stand' || walk ? Math.max(0, Math.sin(t * 14)) * .12 * (Math.sin(t * 1.7) > .2 ? 1 : 0) : 0);
  const ns = h.nose.userData.s || (h.nose.userData.s = h.nose.scale.clone());
  h.nose.scale.copy(ns).multiplyScalar(sn);
  const blink = (t % 4.6) < .12 ? .15 : 1;
  const lid = pose === 'huff' ? .35 : blink;
  h.eyes.forEach((e) => { e.children[0].scale.y = lid; e.children[1].visible = lid > .5; });
  h.ball.scale.set(1 + Math.sin(t * 1.5) * .015, 1 - Math.sin(t * 1.5) * .02, 1 + Math.sin(t * 1.5) * .015);
  if (pose === 'ball' && !S.torpor) h.ball.position.x = Math.sin(t * 30) * .006; else h.ball.position.x = 0;
}

function updateCamera(focus, dt) {

  let tgt, dist, el = .3, az = 0;
  if (T.mode === 'hand' || (T.stage && T.stage.hands)) { tgt = V3(HAND.x, HAND.y + .5, HAND.z); dist = 5.2; el = .45; az = .25; }
  else if (T.look && now < T.look.until) { tgt = T.look.p.clone().add(V3(0, .4, 0)); dist = T.look.dist || 5.6; el = .42; }
  else if (T.mode === 'fx') { tgt = V3(focus.x, Math.max(.6, focus.y + .4), focus.z); dist = 7; el = .36; }
  else if (T.mode === 'out') { tgt = V3(focus.x * .5, .8, 3.2); dist = 12; el = .38; }
  else if (T.zoom) { tgt = V3(focus.x, focus.y + .55, focus.z); dist = 6; el = .34; }
  else { tgt = V3(.2, 1.5, .2); dist = 13.5; el = .2; }
  const k = Math.min(1, dt * 3);
  C.tgt.lerp(tgt, k); C.dist += (dist * u.zoom - C.dist) * k; C.el += (el + u.el - C.el) * k; C.az += (az + u.az - C.az) * k;
  const cam = R.camera;
  cam.position.set(C.tgt.x + Math.sin(C.az) * Math.cos(C.el) * C.dist, C.tgt.y + Math.sin(C.el) * C.dist, C.tgt.z + Math.cos(C.az) * Math.cos(C.el) * C.dist);
  cam.position.y = Math.max(.4, cam.position.y);
  cam.lookAt(C.tgt);
}

function frame(ts) {
  requestAnimationFrame(frame);
  if (!R || !S || document.hidden) return;
  const dt = Math.min(.05, (ts - R.last) / 1000); R.last = ts; R.t += dt;
  const now = Date.now();
  updateEnvironment(now, dt);
  updateProps(dt);
  runFx(dt);
  if (R.signName !== S.name) { R.signName = S.name; R.room.setSign(S.name); }
  const dozing = S.act === 'sleep' && !T.mode && !R.carry && R.H && R.H.pos.distanceTo(IGLOO_IN) < .4;
  R.room.zzz.forEach((z, i) => {
    const k = ((R.t * .35 + i / 3) % 1);
    z.visible = dozing;
    z.position.set(IGLOO.x + .3 + k * .5, BED + 2.2 + k * 1.1, IGLOO.z + .2);
    z.scale.setScalar(.25 + k * .35);
    z.material.opacity = Math.sin(k * Math.PI);
  });
  const { pose, focus } = driveHog(now, dt);
  poseHog(R.hog, pose, R.t, dt);
  updateCamera(focus, dt);
  R.renderer.render(R.scene, R.camera);
}

/* ---------- care effects ---------- */
const FX = [];
function addFx(fn) { FX.push({ t: 0, fn }); }
function runFx(dt) { for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.t += dt; if (!f.fn(f.t, dt)) FX.splice(i, 1); } }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// Animate over dur seconds; also settles on a timer so a hidden tab never leaves an effect half-done.
function tween(dur, fn) {
  return new Promise((res) => {
    let done = false;
    const finish = () => { if (done) return; done = true; fn(1); res(); };
    addFx((t) => { if (done) return false; const k = Math.min(1, t / dur); fn(k); if (k >= 1) { finish(); return false; } return true; });
    setTimeout(finish, dur * 1000 + 1500);
  });
}
function carry(to, o = {}) {
  if (!R || !R.hog) return Promise.resolve();
  return new Promise((res) => {
    const timer = setTimeout(() => { if (R.carry && R.carry.res === done) { R.H.pos.copy(to); if (o.loc) R.H.loc = o.loc; R.carry = null; } res(); }, (o.dur || .9) * 1000 + 1500);
    function done() { clearTimeout(timer); res(); }
    R.carry = { from: R.hog.root.position.clone(), to: to.clone(), t: 0, dur: o.dur || .9, lift: o.lift ?? 1.6, pose: o.pose, yaw: o.yaw, loc: o.loc, hands: o.hands, res: done };
  });
}
const heldPose = () => (S.trust < 45 ? 'ball' : 'stand');
const cageSpot = () => freeSpot(hogScale(), V3(-.4, BED, .6));
function burst({ n, geo, color, at, vel, life, gravity = -9.8, floorY = null, opacity = 1, delay = .3 }) {
  if (!R) return;
  const mat = std(color, { roughness: .5, transparent: opacity < 1 || true, opacity });
  const g = new THREE.Group(); R.scene.add(g);
  const ps = [];
  for (let i = 0; i < n; i++) { const m = mesh(geo, mat, { p: at(i), cast: false }); m.userData.v = vel(i); m.userData.d = rand(0, delay * life); m.visible = false; g.add(m); ps.push(m); }
  addFx((t, dt) => {
    for (const m of ps) {
      if (t < m.userData.d) continue;
      m.visible = true;
      const v = m.userData.v; v.y += gravity * dt; m.position.addScaledVector(v, dt);
      if (floorY !== null && m.position.y < floorY) { m.position.y = floorY; v.set(0, 0, 0); }
      m.rotation.x += dt * 4; m.rotation.z += dt * 3;
    }
    if (t > life * .65) mat.opacity = opacity * Math.max(0, 1 - (t - life * .65) / (life * .35));
    if (t > life) { R.scene.remove(g); return false; }
    return true;
  });
}

// Props that only appear while you do something: measuring cup, jug, tweezers, scoop, scale, tub, carrier, clippers.
const SCALE_P = V3(2.7, 0, 3.9), TUB_P = V3(-2.6, 0, 3.9), CARRIER_P = V3(.2, 0, 4.1);

    g.add(mesh(new THREE.ConeGeometry(.1, .3, 12), std('#cfe4ee', { roughness: .1, transparent: true, opacity: .6 }), { p: V3(.36, .32, 0), r: [0, 0, -1.1] }));
    g.add(mesh(new THREE.TorusGeometry(.2, .04, 8, 16, Math.PI), std('#cfe4ee', { roughness: .1, transparent: true, opacity: .7 }), { p: V3(-.34, .05, 0), r: [0, 0, Math.PI / 2] }));

  } else if (name === 'scale') {

    g.add(mesh(new THREE.CylinderGeometry(.62, .62, .05, 36), metal, { p: V3(0, .23, -.08), recv: true }));
    const c = document.createElement('canvas'); c.width = 256; c.height = 96;
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
    g.add(mesh(new THREE.PlaneGeometry(.7, .18), new THREE.MeshBasicMaterial({ map: tex }), { p: V3(0, .1, .66), cast: false }));
    g.userData.lcd = (txt) => { const x = c.getContext('2d'); x.fillStyle = '#c9d8b6'; x.fillRect(0, 0, 256, 96); x.fillStyle = '#1e2a18'; x.font = 'bold 64px monospace'; x.textAlign = 'right'; x.fillText(txt, 236, 74); tex.needsUpdate = true; };
    g.userData.lcd('0 g');
    g.position.copy(SCALE_P);
  } else if (name === 'tub') {
    const prof = [[0, 0], [.75, 0], [.85, .04], [.95, .42], [.9, .45], [.8, .08], [0, .08]].map(([x, y]) => new THREE.Vector2(x, y));
    g.add(mesh(new THREE.LatheGeometry(prof, 40), std('#e9eef0', { roughness: .3 }), { recv: true }));
    g.add(mesh(new THREE.CylinderGeometry(.84, .8, .02, 36), std('#a9d2e6', { roughness: .03, transparent: true, opacity: .6 }), { p: V3(0, .2, 0), cast: false }));

  }
  R.props[name] = g;
  return g;
}
function hideProp(name) { if (R && R.props && R.props[name]) R.props[name].visible = false; }

// Runs a care action with its 3D effect while the controls are locked. Without 3D the change applies at once.
async function perform(label, visual, apply) {
  if (!R) { apply(); return; }
  T.mode = 'fx'; T.fxLabel = label; render();
  let applied = false;
  const once = () => { if (!applied) { applied = true; apply(); render(); } };
  try { await visual(once); } catch (e) { /* keep the app usable even if an effect fails */ }
  once();
  T.mode = null; T.stage = null; T.look = null; T.fxLabel = '';
  render(); save();
}

async function fxFood(apply) {
  T.look = { p: FOOD.clone(), until: Date.now() + 3200 };
  const cup = prop('cup'); cup.position.set(FOOD.x - .45, 2.2, FOOD.z); cup.rotation.set(0, 0, 0); cup.scale.setScalar(.01);
  await tween(.35, (k) => cup.scale.setScalar(Math.max(.01, easeIO(k))));
  await tween(.45, (k) => { cup.rotation.z = -1.9 * easeIO(k); cup.position.y = 2.2 - .4 * k; });
  burst({ n: 34, geo: new THREE.SphereGeometry(.05, 6, 5), color: '#8b5a33', life: 1.6, delay: .4, floorY: FOOD.y + .16,
    at: () => V3(FOOD.x - .2 + rand(-.08, .08), 1.65, FOOD.z + rand(-.1, .1)), vel: () => V3(rand(.1, .6), rand(-.5, 0), rand(-.35, .35)) });

async function fxWorm(apply) {

  const f = V3(Math.cos(H.yaw), 0, -Math.sin(H.yaw));
  let p = V3(H.pos.x + f.x * 1.5 * s, BED, H.pos.z + f.z * 1.5 * s);
  const q = p.clone(); pushOut(q, 0, .25, null, true); p = q;
  T.look = { p: p.clone(), until: Date.now() + 2600 };
  const tw = prop('tweezers'), worm = prop('worm');
  tw.position.set(p.x, 2.4, p.z); worm.position.set(p.x - .2, 2.4, p.z); worm.rotation.set(0, rand(0, 6), 0);
  await tween(.6, (k) => { tw.position.y = 2.4 - 1.95 * easeIO(k); worm.position.y = tw.position.y; });
  await tween(.4, (k) => { worm.position.y = (BED + .45) * (1 - k) + BED * k; });
  await tween(.4, (k) => { tw.position.y = BED + .45 + 2 * k; });
  hideProp('tweezers');
  T.worm = { p, left: 1 };
  apply();
}

function eatWorm(dt) {
  const w = T.worm; if (!w || !R.props || !R.props.worm) return;
  w.left -= dt / 2.6;
  R.props.worm.scale.set(Math.max(.05, w.left), 1, 1);

  } else setV('vWeight', '?', '', '저울로 재 보세요', 'warn');

  setV('vTemp', temp.toFixed(1), '°C', temp < 22 ? '추워요 · 24~27°C' : temp > 29 ? '더워요' : '적정 24~27°C', temp < 21 ? 'bad' : temp < 23 ? 'warn' : '');
  setV('vFood', S.food.toFixed(0), 'g', S.food < 2 ? '비었어요' : S.food < 6 ? '얼마 안 남았어요' : `${BOWL_FOOD}g 중`, S.food < 2 ? 'bad' : S.food < 6 ? 'warn' : '');

  }).join('');
  $('condNote').textContent = known ? `적정 체중 ${lo}~${hi}g` : '';

  const al = [];
  if (S.torpor) al.push(['bad', '동면 시도 중: 히터를 켜고 손으로 따뜻하게 해 주세요']);
  if (S.mites) al.push(['bad', '진드기 의심: 동물병원에 가 보세요']);
  if (S.health < 40) al.push(['bad', '건강이 나빠요']);
  if (S.weight > tw * 1.2) al.push(['warn', '과체중']);
  if (S.weight < tw * .82) al.push(['warn', '저체중']);
  if (aw < 12.5) al.push(['warn', '가시갈이 시기라 예민해요']);

  if (S.nails > 75) al.push(['warn', '손톱이 길어요']);
  if (!S.heater && temp < 23) al.push(['warn', '히터가 꺼져 있어요']);
  $('alerts').innerHTML = al.map(([c, t]) => `<span class="${c}">${t}</span>`).join('');

  const nightKm = S.night.key ? (S.night.wheel / 1000).toFixed(1) : '0.0';

function weigh() {

/* ================= holding the hedgehog ================= */
function startHandling() {
  const now = Date.now();
  const wasSleeping = sleepingNow() || S.act === 'sleep';
  const cold = S.torpor;
  endSession(S, now);
  T.mode = 'hand';
  const quilling = ageWeeks(S, now) < 12.5;
  const h = { start: now, gained: 0, strokes: [], treat: false, ant: false, cold, quilling };
  // How long it stays rolled up depends on trust, quilling, and whether it was woken.
  let curl = 1200 + (100 - S.trust) * 55 + (quilling ? 2000 : 0);
  if (wasSleeping && !isNight(now)) { curl += 3000; S.trust = clamp(S.trust - 2); log(S, now, `자고 있던 ${S.name}을(를) 꺼내서 손에 올렸어요. 잠이 덜 깨 예민해요`); }
  if (cold) curl = 1e9;
  h.state = S.trust > 70 && !wasSleeping && !quilling ? 'calm' : 'curl';
  h.until = now + (h.state === 'curl' ? curl : 0);
  T.hand = h;
  $('overlay').innerHTML = `<div class="hand">
    <div class="hand-say" id="handSay"></div>
    <div class="hand-bar">
      <button type="button" id="hStroke">살살 쓰다듬기</button>
      <button type="button" id="hWorm">손으로 밀웜 주기</button>
      <button type="button" id="hDown" class="done">내려놓기</button>
    </div></div>`;
  $('hStroke').addEventListener('click', handStroke);
  $('hWorm').addEventListener('click', handWorm);
  $('hDown').addEventListener('click', endHandling);
  T.handTimer = setInterval(handTick, 400);
  carry(V3(HAND.x, HAND.y + .22, HAND.z), { dur: .9, hands: true, loc: 'hand', pose: 'ball' });
  handDraw();
  render();
}
const HAND_TEXT = {

  huff: '"후웁, 후웁" 소리를 내며 이마 가시를 세웠어요. 아직 경계 중이에요.',
  calm: '몸을 풀고 코를 킁킁거리며 손 냄새를 맡고 있어요.',

  ant: '손 냄새가 신기한지 침 거품을 만들어 가시에 바르는 안팅을 해요.',

function handTick() {

  const now = Date.now();
  if (h.cold) {
    S.cold = 0;
    if (S.heater && now - h.start > 8000) { h.cold = false; S.torpor = false; h.state = 'curl'; h.until = now + 2500; log(S, now, '손의 온기와 히터 덕분에 몸이 따뜻해져 깨어났어요'); }
    else h.state = 'cold';
  } else if (now >= h.until) {
    if (h.state === 'curl') { h.state = 'huff'; h.until = now + 1800; }
    else if (h.state === 'huff' || h.state === 'eat' || h.state === 'ant') { h.state = 'calm'; h.until = now + rand(3000, 6000); }
    else if (h.state === 'calm') {
      if (!h.ant && S.trust > 45 && Math.random() < .12) { h.ant = true; h.state = 'ant'; h.until = now + 5000; log(S, now, '손 냄새를 맡고 안팅을 했어요'); }
      else { h.state = 'explore'; h.until = now + rand(3000, 6000); }
    } else if (h.state === 'explore') { h.state = 'calm'; h.until = now + rand(3000, 6000); }
  }
  handDraw();
}
function handStroke() {
  const h = T.hand; if (!h || h.state === 'cold') return;
  const now = Date.now();
  h.strokes = h.strokes.filter((x) => now - x < 2500); h.strokes.push(now);
  if (h.state === 'curl' || h.state === 'huff') {
    if (h.strokes.length >= 3) { h.state = 'curl'; h.until = now + 2500; toast('너무 자주 만지면 더 몸을 말아요. 기다려 주세요'); }
    else h.until -= 400; // gentle touch helps it relax a little
  } else if (h.strokes.length >= 4) {
    h.state = 'huff'; h.until = now + 1800; S.trust = clamp(S.trust - .5);
    toast('연달아 만져서 놀랐어요. 천천히 쓰다듬어 주세요');
  } else if (h.gained < 6) {
    const g = .8; h.gained += g; S.trust = clamp(S.trust + g);
    $('handSay').textContent = '가시 결을 따라 머리에서 꼬리 쪽으로 쓰다듬었어요. 가시를 눕히고 편안해해요.';
    return;
  }
  handDraw();
}
function handWorm() {
  const h = T.hand; if (!h || h.treat) return;
  const now = Date.now();
  if (h.state === 'curl') { toast('몸을 말고 있어서 먹지 않아요. 풀 때까지 기다려 주세요'); return; }
  h.treat = true;
  if (S.treats.day !== dayKey(now)) S.treats = { day: dayKey(now), n: 0 };
  S.treats.n++; S.satiety = clamp(S.satiety + 4); S.weight += S.treats.n > TREAT_LIMIT ? 2.5 : .6;
  const g = Math.min(2.5, 9 - h.gained); if (g > 0) { h.gained += g; S.trust = clamp(S.trust + g); }
  h.state = 'eat'; h.until = now + 2600;
  if (S.treats.n > TREAT_LIMIT) toast(`오늘 밀웜 ${S.treats.n}마리째예요. 너무 많으면 살이 쪄요`);
  handDraw();
}
function endHandling() {
  const h = T.hand; if (!h) return;
  const now = Date.now(), secs = Math.round((now - h.start) / 1000);
  clearInterval(T.handTimer);
  const calm = h.state === 'calm' || h.state === 'explore' || h.state === 'eat';
  if (calm && secs >= 20) { S.trust = clamp(S.trust + 2); h.gained += 2; }
  T.hand = null; T.mode = null;
  $('overlay').innerHTML = '';
  carry(cageSpot(), { dur: .9, hands: true, loc: 'cage' });
  if (!S.torpor) { S.act = isNight(now) ? 'roam' : 'sleep'; S.actUntil = now + (isNight(now) ? 5 : 30) * MIN; S.sess = null; }
  log(S, now, `${secs}초 동안 손에 올려 교감했어요${h.treat ? ' (밀웜 1마리)' : ''}. ${calm ? '편안한 상태로 내려놓았어요' : '아직 경계하는 상태로 내려놓았어요'}`);
  done(h.gained >= 1 ? '신뢰가 조금 쌓였어요' : '매일 저녁 조금씩 만져 주면 신뢰가 쌓여요');
}

function outingTick(now) {

function endOuting() {

function weightChart() {
  const W = S.weights;
  if (W.length < 2) return '<p>체중을 두 번 이상 재면 그래프가 나타나요.</p>';
  const w = 320, h = 140, pl = 34, pr = 8, pt = 10, pb = 20;
  const t0 = W[0].t, t1 = W[W.length - 1].t || t0 + 1;
  const band = W.map((p) => targetWeight(ageWeeks(S, p.t)));
  const vals = W.map((p) => p.g).concat(band.map((b) => b * 1.15), band.map((b) => b * .85));
  const lo = Math.floor(Math.min(...vals) / 20) * 20, hi = Math.ceil(Math.max(...vals) / 20) * 20;
  const X = (t) => pl + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (w - pl - pr);
  const Y = (g) => pt + (1 - (g - lo) / (hi - lo)) * (h - pt - pb);
  const bandPath = W.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(band[i] * 1.15).toFixed(1)}`).join('') + W.slice().reverse().map((p, i) => `L${X(p.t).toFixed(1)} ${Y(band[W.length - 1 - i] * .85).toFixed(1)}`).join('') + 'Z';
  const line = W.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.g).toFixed(1)}`).join('');
  const last = W[W.length - 1];
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="체중 변화 그래프">
    ${ticks.map((g) => `<line x1="${pl}" x2="${w - pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${pl - 4}" y="${Y(g) + 3}" text-anchor="end">${g}g</text>`).join('')}
    <path d="${bandPath}" fill="var(--accent)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${W.map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.g)}" r="2" fill="var(--accent)"/>`).join('')}
    <circle cx="${X(last.t)}" cy="${Y(last.g)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${h - 4}">${new Date(t0).getMonth() + 1}/${new Date(t0).getDate()}</text>
    <text x="${w - pr}" y="${h - 4}" text-anchor="end">${new Date(t1).getMonth() + 1}/${new Date(t1).getDate()}</text>
  </svg><p style="font-size:12px">옅은 띠는 나이별 적정 체중 범위예요.</p>`;
}

  render();
  const morphs = Object.entries(COATS).map(([k, c]) => `<button class="opt" type="button" data-morph="${k}" aria-pressed="${k === 'sp'}">${swatch(c)}${c.label}</button>`).join('');
  openSheet(`<h3>고슴도치 데려오기</h3>
    <p>생후 8주 된 아프리카 피그미 고슴도치를 집으로 데려왔어요. 케이지와 나무 오두막, 쳇바퀴, 히터는 준비되어 있어요.</p>
    <div class="sec">이름</div>
    <input class="input" id="adName" maxlength="12" value="도치" autocomplete="off" aria-label="이름">
    <div class="sec">색</div>
    <div class="opts">${morphs}</div>
    <div class="sec">성별</div>
    <div class="opts two"><button class="opt" type="button" data-sex="m" aria-pressed="true">수컷</button><button class="opt" type="button" data-sex="f" aria-pressed="false">암컷</button></div>
    <div class="actions">${SLOTS.ids.length ? '<button class="btn ghost" type="button" id="adBack">돌아가기</button>' : ''}<button class="btn" type="button" id="adGo">집에 데려오기</button></div>`);
  if ($('adBack')) $('adBack').addEventListener('click', showPicker);
  sheet.querySelectorAll('[data-morph]').forEach((b) => b.addEventListener('click', () => {
    choice.morph = b.dataset.morph;
    sheet.querySelectorAll('[data-morph]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    S.morph = choice.morph; render();
  }));
  sheet.querySelectorAll('[data-sex]').forEach((b) => b.addEventListener('click', () => {
    choice.sex = b.dataset.sex;
    sheet.querySelectorAll('[data-sex]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  }));
  $('adGo').addEventListener('click', () => {
    const name = $('adName').value.trim() || '도치';
    S = newState(name, choice.sex, choice.morph);
    const now = Date.now();
    S.act = isNight(now) ? 'roam' : 'sleep'; S.actUntil = now + 20 * MIN;
    log(S, now, `${name}을(를) 집에 데려왔어요. 낯선 곳이라 아직 많이 경계해요`);
    adopted = true;
    SLOTS.ids.push(S.id); SLOTS.active = S.id; writeSlots();
    resetScene();
    closeSheet(); render(); save();
    toast(isNight(now) ? '밤이라 깨어 있어요. 오늘은 조용히 지켜봐 주세요' : '낮이라 오두막에서 자고 있어요. 저녁에 깨어나요');
  });
}

/* ================= main loop ================= */
let ticks = 0;
function tick() {
  if (!adopted) return;
  const now = Date.now(), gap = now - S.last;
  if (gap > 90e3) {
    // the page was in the background: replay the missed time minute by minute
    const before = { tot: Object.assign({}, S.tot), last: S.last };
    catchUp(S, now);
    if (gap > 30 * MIN && sheetWrap.hidden && !T.mode) showReturn(before, gap);
  } else {
    step(S, Math.max(0, gap), now, !!T.mode);
    S.last = now;
  }
  if (T.mode === 'out') outingTick(now);
  render();
  if (++ticks % 5 === 0) save();
}

// Earlier versions of this app (도치 키우기 / 도치 대모험) saved under another key. Bring that hedgehog over
// so the owner keeps raising the same animal: its name, the day it arrived, how much it trusts them and its health.
function importOldGame() {
  let old = null;
  try { const r = localStorage.getItem('dochi-save-v1'); old = r ? JSON.parse(r) : null; } catch (e) { old = null; }
  if (!old || !old.name || !old.born) return null;
  const morph = { sweet: 'albino', foodie: 'cinnamon', explorer: 'chocolate' }[old.form] || 'sp';
  const s = newState(old.name, 'm', morph);
  const now = Date.now();
  s.adopted = Math.min(old.born, now);
  s.last = now;
  s.weight = targetWeight(ageWeeks(s, now)) * (old.full > 30 ? 1 : .9);
  s.satiety = clamp(old.full ?? 70); s.health = clamp(old.health ?? 90);
  s.dirt = clamp(100 - (old.clean ?? 80)); s.trust = clamp(15 + (old.happy ?? 50) * .5 + Math.min(30, (old.xp || 0) / 30));
  s.poops = (old.poops || []).slice(0, 10).map(() => ({ w: 0, p3: 1, x: rand(-1.6, 4.2), z: rand(-2, 2) }));
  s.act = isNight(now) ? 'roam' : 'sleep'; s.actUntil = now + 20 * MIN;
  log(s, now, `이전 버전에서 키우던 ${old.name}을(를) 그대로 데려왔어요. 이제 실제 고슴도치처럼 돌봐 주세요`);
  return s;
}

// Put hedgehogs saved by earlier versions into the list the first time this version runs.
function initSlots() {
  const sl = readSlots();
  if (sl) { SLOTS = sl; return; }
  SLOTS = { active: null, ids: [] };
  let first = load(), imported = false;
  if (!first) { first = importOldGame(); imported = !!first; }
  if (first && first.v === 1 && first.morph) {
    const h = upgrade(first);
    try { localStorage.setItem(hogKey(h.id), JSON.stringify(h)); SLOTS.ids.push(h.id); SLOTS.active = h.id; } catch (e) { /* storage unavailable */ }
    if (imported) setTimeout(() => toast(`이전에 키우던 ${h.name}을(를) 목록에 데려왔어요`), 600);
  }
  writeSlots();
}

function start(data) {
  try { if (!window.THREE) throw new Error('three.js not loaded'); init3D(); } catch (e) { console.error('3D unavailable:', e); R = null; $('nogl').hidden = false; $('zoomBtn').hidden = true; }
  initSlots();
  if (data && data.S) {
    // a live update of the page: keep looking after the same hedgehog without asking again
    S = upgrade(data.S); adopted = true;
    if (!SLOTS.ids.includes(S.id)) { SLOTS.ids.push(S.id); writeSlots(); }
    catchUp(S, Date.now()); resetScene(); render(); save();
  } else showPicker();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else tick(); });
  window.addEventListener('pagehide', save);
}

if (window.claude?.hot) window.claude.hot.snapshot?.(() => ({ S: adopted ? S : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
