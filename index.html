<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4e6b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>우리 집 고슴도치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column like a pet-care journal. Room scene on top, live readings, condition list, care actions, then the observation log. */
:root {
  --bg: #f2f0eb;
  --surface: #ffffff;
  --ink: #2a2926;
  --muted: #74706a;
  --line: #e1ddd4;
  --accent: #4e6b4a;      /* moss: primary actions, good state */
  --accent-ink: #ffffff;
  --warn: #b7791f;
  --bad: #b4483c;
  --shadow: 0 1px 2px rgba(42, 41, 38, .06), 0 8px 24px -16px rgba(42, 41, 38, .35);
  --font-head: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1a; --surface: #252623; --ink: #ecebe6; --muted: #a3a097; --line: #383934;
    --accent: #8fb487; --accent-ink: #1b1c1a; --warn: #e0a84a; --bad: #e57b6c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1a; --surface: #252623; --ink: #ecebe6; --muted: #a3a097; --line: #383934;
  --accent: #8fb487; --accent-ink: #1b1c1a; --warn: #e0a84a; --bad: #e57b6c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-inline: 16px; padding-block: 14px 28px;
}
button { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* header */
.top { display: flex; align-items: flex-end; gap: 12px; }
.who { flex: 1; min-width: 0; }
.name { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.meta { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.icon-btn { flex: none; border: 1px solid var(--line); background: var(--surface); height: 36px; padding: 0 12px; border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--muted); }

/* scene */
.scene { position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #e8e2d8; user-select: none; -webkit-user-select: none; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cap { position: absolute; left: 10px; top: 10px; right: 100px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.cap span { background: rgba(28, 27, 24, .62); color: #f5f3ee; font-size: 12px; padding: 3px 9px; border-radius: 99px; backdrop-filter: blur(4px); font-variant-numeric: tabular-nums; }
.zoom { position: absolute; right: 10px; top: 10px; border: 0; border-radius: 99px; padding: 4px 11px; font-size: 12px; background: rgba(28, 27, 24, .62); color: #f5f3ee; cursor: pointer; }
.zoom:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#hogG { transition: transform 2.6s linear; }
#hogG.jump { transition: none; }
#hogG svg, .hand-hog svg { overflow: visible; }
.legs rect { transform-box: fill-box; }
.walking .legs rect { animation: step .32s infinite alternate ease-in-out; }
.running .legs rect { animation: step .14s infinite alternate linear; }
.walking .legs rect:nth-child(2), .running .legs rect:nth-child(2) { animation-direction: alternate-reverse; }
@keyframes step { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
.sniff { transform-box: fill-box; transform-origin: left center; animation: sniff 1.8s infinite; }
@keyframes sniff { 0%, 62%, 100% { transform: none; } 70% { transform: translate(1.5px, -1px) scale(1.08); } 78% { transform: none; } 86% { transform: translate(1.5px, -1px) scale(1.08); } }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(.1); } }
.breathe { transform-box: fill-box; transform-origin: center bottom; animation: breathe 3.8s infinite ease-in-out; }
@keyframes breathe { 50% { transform: scale(1.02, .975); } }
.shiver { animation: shiver .14s infinite; }
@keyframes shiver { 50% { transform: translateX(1px); } }
.spin { transform-origin: 330px 196px; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.munch { transform-box: fill-box; transform-origin: center top; animation: munch .35s infinite; }
@keyframes munch { 50% { transform: scaleY(.4); } }
.foam { animation: foam 1.2s infinite alternate; }
@keyframes foam { to { opacity: .5; } }

/* handling overlay */
.hand { position: absolute; inset: 0; z-index: 5; background: radial-gradient(circle at 50% 60%, #57534b, #26241f 75%); display: flex; flex-direction: column; justify-content: flex-end; }
.hand-stage { position: absolute; inset: 0 0 64px; }
.hand-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hand-say { position: absolute; left: 12px; right: 12px; top: 10px; color: #f2efe8; font-size: 13px; text-align: center; line-height: 1.45; background: rgba(0,0,0,.35); border-radius: 10px; padding: 6px 10px; }
.hand-bar { position: relative; display: flex; gap: 6px; padding: 10px; background: rgba(0,0,0,.35); }
.hand-bar button { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 9px 4px; font-size: 13px; font-weight: 500; cursor: pointer; background: #f2efe8; color: #2a2926; }
.hand-bar button.done { background: #4e6b4a; color: #fff; }
.hand-bar button:disabled { opacity: .45; cursor: default; }

/* readings */
.vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.vital { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; min-width: 0; }
.vital .k { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.vital .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
.vital .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 1px; }
.vital .n { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vital.warn .n { color: var(--warn); } .vital.bad .n { color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.panel h2 { margin: 0 0 8px; font-family: var(--font-head); font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 small { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); }
.cond { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.c { display: grid; grid-template-columns: 4.6em 1fr auto; align-items: center; gap: 8px; min-width: 0; }
.c label { font-size: 13px; color: var(--muted); }
.c .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.c .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s; }
.c .w { font-size: 12px; min-width: 2.4em; text-align: right; }
.c.warn .bar i { background: var(--warn); } .c.warn .w { color: var(--warn); }
.c.bad .bar i { background: var(--bad); } .c.bad .w { color: var(--bad); font-weight: 700; }
.alerts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.alerts:empty { display: none; }
.alerts span { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.alerts span.bad { border-color: var(--bad); color: var(--bad); }
.alerts span.warn { border-color: var(--warn); color: var(--warn); }

.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 6px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; position: relative; }
.act b { font-weight: 500; font-size: 13px; line-height: 1.3; }
.act span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.need { border-color: var(--warn); }
.act.need span { color: var(--warn); }
.act.urgent { border-color: var(--bad); }
.act.urgent span { color: var(--bad); }
.act:active { transform: scale(.97); }
.act:disabled { opacity: .4; cursor: default; }
.act:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .opt:focus-visible, .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 3.6em 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
.log li.bad span { color: var(--bad); }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 0; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(20, 19, 16, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 86%; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0; font-family: var(--font-head); font-size: 21px; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .sec { font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-top: 4px; }
.sheet ul { margin: 0; padding-left: 1.1em; line-height: 1.75; }
.sheet dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.sheet dt { color: var(--muted); }
.sheet dd { margin: 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 500; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad); color: #fff; }
.input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; min-width: 0; }
.opt svg { width: 100%; height: auto; aspect-ratio: 1.2; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.big-read { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.big-read small { font-size: 18px; color: var(--muted); font-weight: 500; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); text-align: center; transition: opacity .3s; }
.toast.hide { opacity: 0; pointer-events: none; }

@media (max-width: 400px) {
  .vitals { grid-template-columns: 1fr 1fr; }
  .cond { grid-template-columns: 1fr; }
  .acts { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="who">
      <h1 class="name" id="name">도치</h1>
      <p class="meta" id="meta">아프리카 피그미 고슴도치</p>
    </div>
    <button class="icon-btn" id="menuBtn" type="button">기록 · 가이드</button>
  </header>

  <section class="scene" id="scene" aria-label="고슴도치가 사는 방">
    <svg id="room" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0" stop-color="#9fcbe6"/><stop id="sky2" offset="1" stop-color="#dcecf2"/></linearGradient>
        <radialGradient id="heatGlow"><stop offset="0" stop-color="#ffb26b" stop-opacity=".42"/><stop offset="1" stop-color="#ffb26b" stop-opacity="0"/></radialGradient>
        <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffe2a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
        <pattern id="planks" width="96" height="16" patternUnits="userSpaceOnUse">
          <rect width="96" height="16" fill="#b78a5f"/><rect width="96" height="1" fill="#9c7350"/>
          <rect x="40" y="0" width="1" height="16" fill="#9c7350"/><rect y="7" width="96" height="2" fill="#bf9367" opacity=".6"/>
        </pattern>
        <clipPath id="winClip"><rect x="28" y="30" width="92" height="94"/></clipPath>
      </defs>
      <rect width="400" height="212" fill="#e7e1d6"/>
      <rect width="400" height="212" fill="#000" opacity=".03"/>
      <!-- window with the real sky -->
      <rect x="22" y="24" width="104" height="106" fill="#f6f3ec"/>
      <rect x="28" y="30" width="92" height="94" fill="url(#sky)"/>
      <g clip-path="url(#winClip)"><g id="stars"></g><circle id="sun" cx="95" cy="56" r="9" fill="#ffe27a"/></g>
      <path d="M74 30 V124 M28 77 H120" stroke="#f6f3ec" stroke-width="4"/>
      <rect x="18" y="128" width="112" height="6" rx="2" fill="#efeae1"/>
      <path d="M14 18 Q24 80 18 136 L34 136 Q30 80 34 18 Z" fill="#c9bba6"/>
      <path d="M134 18 Q124 80 130 136 L114 136 Q118 80 114 18 Z" fill="#c9bba6"/>
      <rect x="10" y="14" width="128" height="5" rx="2" fill="#8d7b66"/>
      <!-- wall clock -->
      <g transform="translate(362 44)">
        <circle r="17" fill="#faf8f3" stroke="#6d6458" stroke-width="2.5"/>
        <g id="ticks"></g>
        <line id="hourHand" x1="0" y1="0" x2="0" y2="-8" stroke="#3a352f" stroke-width="2.4" stroke-linecap="round"/>
        <line id="minHand" x1="0" y1="0" x2="0" y2="-12.5" stroke="#3a352f" stroke-width="1.6" stroke-linecap="round"/>
        <circle r="1.6" fill="#3a352f"/>
      </g>
      <!-- floor -->
      <rect y="206" width="400" height="7" fill="#d8d0c3"/>
      <rect y="212" width="400" height="88" fill="url(#planks)"/>
      <ellipse cx="70" cy="282" rx="66" ry="12" fill="#a99b86" opacity=".55"/>
      <!-- heater lamp -->
      <path d="M262 0 V52" stroke="#4a4540" stroke-width="1.5"/>
      <path d="M248 52 Q262 44 276 52 L282 70 Q262 64 242 70 Z" fill="#4c4c4c"/>
      <ellipse id="bulb" cx="262" cy="70" rx="13" ry="4" fill="#8a8580"/>
      <ellipse id="heat" cx="262" cy="160" rx="130" ry="120" fill="url(#heatGlow)"/>
      <!-- cage: back panel -->
      <rect x="132" y="116" width="256" height="148" rx="5" fill="#dbe7ec" opacity=".45" stroke="#b5c4cc" stroke-width="1"/>
      <path d="M134 228 Q160 223 190 227 T250 225 T320 227 T386 224 V262 H134 Z" fill="#ece2cd"/>
      <g id="bedTex"></g>
      <g id="shedG"></g>
      <g id="hogBack"></g>
      <!-- hide (igloo) -->
      <path d="M144 252 Q146 198 180 196 Q214 198 216 252 Z" fill="#8a78b6" opacity=".8"/>
      <path d="M150 252 Q152 204 180 202 Q190 202 198 208" stroke="#fff" stroke-width="2" fill="none" opacity=".25"/>
      <path d="M166 252 Q167 226 180 225 Q193 226 194 252 Z" fill="#3d3156" opacity=".5"/>
      <!-- food bowl -->
      <path d="M222 246 Q238 262 254 246 Z" fill="#e9e4dc"/>
      <path d="M222 246 L225 254 Q238 260 251 254 L254 246 Z" fill="#c9c2b6"/>
      <ellipse cx="238" cy="246" rx="16" ry="4.5" fill="#d8d1c5"/>
      <g id="kibble"></g>
      <!-- water bowl -->
      <path d="M262 247 L265 255 Q278 261 291 255 L294 247 Z" fill="#9fb5c2"/>
      <ellipse cx="278" cy="247" rx="16" ry="4.5" fill="#b9ccd6"/>
      <ellipse id="water" cx="278" cy="247.5" rx="13" ry="3.2" fill="#7fb1d0" opacity=".85"/>
      <!-- wheel -->
      <path d="M330 196 L312 254 M330 196 L348 254" stroke="#7d8a94" stroke-width="4" stroke-linecap="round"/>
      <circle cx="330" cy="196" r="43" fill="#4f86b5"/>
      <g id="wheelSpin">
        <circle cx="330" cy="196" r="36" fill="#5c93c2"/>
        <path d="M330 160 V232 M294 196 H366 M305 171 L355 221 M355 171 L305 221" stroke="#4a7eab" stroke-width="2"/>
      </g>
      <circle cx="330" cy="196" r="43" fill="none" stroke="#3f6f99" stroke-width="5"/>
      <circle cx="330" cy="196" r="5" fill="#3f6f99"/>
      <g id="poopG"></g>
      <g id="hogFront"></g>
      <!-- cage: front panel -->
      <rect x="132" y="116" width="256" height="148" rx="5" fill="#d6e8f0" opacity=".12" stroke="#9fb2bc" stroke-width="2"/>
      <rect x="130" y="114" width="260" height="6" rx="3" fill="#c4d2d9"/>
      <path d="M150 126 L150 248 M156 126 L156 180" stroke="#fff" stroke-width="2" opacity=".35" stroke-linecap="round"/>
      <!-- thermometer on the cage -->
      <g transform="translate(372 128)"><rect width="12" height="30" rx="6" fill="#f4f2ee" stroke="#9fb2bc"/><rect id="thermoBar" x="4.5" y="6" width="3" height="18" rx="1.5" fill="#d0533f"/><circle cx="6" cy="25" r="3.2" fill="#d0533f"/></g>
      <g id="hogOut"></g>
      <rect id="veil" width="400" height="300" fill="#0d1230" opacity="0" pointer-events="none"/>
      <ellipse id="lamp" cx="262" cy="160" rx="160" ry="150" fill="url(#lampGlow)" opacity="0" pointer-events="none"/>
    </svg>
    <div class="cap"><span id="capTime">--:--</span><span id="capAct">관찰 중</span></div>
    <button class="zoom" id="zoomBtn" type="button">가까이 보기</button>
    <div id="overlay"></div>
  </section>

  <section class="vitals" aria-label="측정값">
    <div class="vital" id="vWeight"><div class="k">체중</div><div class="v">-</div><div class="n">-</div></div>
    <div class="vital" id="vTemp"><div class="k">케이지 온도</div><div class="v">-</div><div class="n">-</div></div>
    <div class="vital" id="vFood"><div class="k">사료 그릇</div><div class="v">-</div><div class="n">-</div></div>
    <div class="vital" id="vWater"><div class="k">물그릇</div><div class="v">-</div><div class="n">-</div></div>
  </section>

  <section class="panel" aria-label="상태">
    <h2>상태 <small id="condNote"></small></h2>
    <div class="cond" id="cond"></div>
    <div class="alerts" id="alerts"></div>
  </section>

  <section class="acts" id="acts" aria-label="돌보기"></section>

  <section class="panel">
    <h2>관찰 일지 <small id="nightNote"></small></h2>
    <ul class="log" id="log"></ul>
  </section>

  <p class="foot">고슴도치의 나이는 현실의 하루가 1주처럼 흘러요. 행동 시간은 실제 시계를 따라요.</p>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast hide" id="toast"></div>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const SAVE_KEY = 'hedgehog-home-v1';
const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const BOWL_FOOD = 25, BOWL_WATER = 150, TREAT_LIMIT = 3;
const SVGNS = 'http://www.w3.org/2000/svg';

/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dayKey = (t) => new Date(t).toDateString();

// Side view facing right inside a 240x200 box (feet at y≈184). Quills come from a seeded stream so

function seeded(seed) {

const COATS = {

  cinnamon:  { label: '시나몬',     dark: '#6e4325', mid: '#b98352', band: '#7a4a2a', tip: '#f8e6c8', face: '#eadac0', mask: '#a5784f', belly: '#f1e6d4', skin: '#d39c86', eye: '#120c09' },

function quill(x, y, ang, len, w, c) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const at = (f) => `${(x + dx * len * f).toFixed(1)} ${(y + dy * len * f).toFixed(1)}`;
  return `<path d="M${at(0)}L${at(1)}" stroke="${c.mid}" stroke-width="${w}"/><path d="M${at(.4)}L${at(.72)}" stroke="${c.band}" stroke-width="${w}"/><path d="M${at(.84)}L${at(1)}" stroke="${c.tip}" stroke-width="${w * .85}"/>`;

function coat(c, size, raised) {
  const rnd = seeded(11), len = [11 + size * 7, 15 + size * 10];
  const pts = [];
  while (pts.length < 175) {
    const x = 30 + rnd() * 140, y = 62 + rnd() * 108;
    const nx = (x - 106) / 80, ny = (y - 128) / 62;
    if (nx * nx + ny * ny > 1 || y > 166) continue;
    if (x > 150 && y > 96 + (x - 150) * .2) continue;
    pts.push([x, y, nx * nx + ny * ny]);
  }
  pts.sort((a, b) => a[2] - b[2]);

    // Calm quills lie back toward the tail; raised quills stand up and forward.
    const lean = raised ? -.05 : -.55;
    const ang = Math.atan2(y - 176, x - 128) + lean + (rnd() - .5) * .35;

function ballSvg(c, size, face) {

    if (128 + Math.sin(a) * r * .9 <= 168) pts.push([a, r]);

  const q = pts.sort((u, v) => u[1] - v[1]).map(([a, r]) =>
    quill(120 + Math.cos(a) * r, 128 + Math.sin(a) * r * .9, a + (rnd() - .5) * .3, len[0] + rnd() * (len[1] - len[0]), 2.3, c)).join('');

    ? `<path d="M140 168 Q156 154 172 166 Q170 178 150 180 Q140 178 140 168 Z" fill="${c.face}"/><ellipse cx="171" cy="169" rx="4.5" ry="3.8" fill="#16100c"/><path d="M151 164 Q155 167 159 164" stroke="#2a1d16" stroke-width="2" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="160" cy="172" rx="7" ry="4.5" fill="${c.face}"/><ellipse cx="166" cy="172" rx="3.4" ry="3" fill="#16100c"/>`;

    <ellipse cx="120" cy="130" rx="56" ry="52" fill="${c.dark}"/><g stroke-linecap="round">${q}</g>${peek}</g>`;
}

/* ================= state ================= */
function newState(name, sex, morph) {
  const now = Date.now();
  return {
    v: 1, name, sex, morph, adopted: now, last: now,
    weight: rand(140, 158), satiety: 70, hydration: 72,
    food: 20, water: 120, dirt: 6, nails: 18, trust: 15, health: 92,
    heater: true, cold: 0, torpor: false, mites: false, feetDirty: false,
    act: 'sleep', actUntil: 0, sess: null,
    poops: [], shed: [], lastBedding: now, lastBath: now - 10 * DAY,
    treats: { day: dayKey(now), n: 0 },

    night: { key: '', wheel: 0 },

}
let S = null, adopted = false;
const T = { mode: null, hand: null, out: null, antUntil: 0, lastSprite: '', lastPos: '' };

function save() { if (!adopted) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }

function log(s, t, m, bad) {
  s.log.unshift({ t, m, bad: !!bad });
  if (s.log.length > 80) s.log.length = 80;
}

/* ================= simulation ================= */
const nightKey = (t) => dayKey(t - 12 * HOUR); // a night belongs to the evening it started

function chooseActivity(s, t) {
  if (s.torpor) return ['torpor', 30];
  if (!isNight(t)) return ['sleep', 30];
  const opts = [];
  if (s.satiety < 78 && s.food > 0) opts.push(['eat', 4, rand(5, 11)]);
  if (s.hydration < 78 && s.water > 0) opts.push(['drink', 3, rand(2, 4)]);
  opts.push(['wheel', 2.5, rand(8, 30)], ['roam', 2, rand(5, 14)], ['rest', 1.2, rand(10, 25)]);
  let r = Math.random() * opts.reduce((a, o) => a + o[1], 0);
  for (const o of opts) { if ((r -= o[1]) < 0) return [o[0], o[2]]; }
  return ['roam', 8];
}
function endSession(s, t) {
  const ss = s.sess; if (!ss) return;
  if (ss.act === 'wheel' && ss.m > 40) log(s, t, `쳇바퀴를 ${Math.round((t - ss.start) / MIN)}분 동안 달렸어요 (약 ${Math.round(ss.m)}m)`);
  if (ss.act === 'eat' && ss.g >= 1) log(s, t, `사료를 ${ss.g.toFixed(0)}g 먹었어요`);
  s.sess = null;
}
function setAct(s, act, t, mins) {
  const prev = s.act;
  endSession(s, t);
  s.act = act; s.actUntil = t + mins * MIN;
  s.sess = { act, start: t, m: 0, g: 0 };
  if (prev === 'sleep' && act !== 'sleep' && act !== 'torpor') log(s, t, '잠에서 깨어 은신처 밖으로 나왔어요');
  if (prev !== 'sleep' && prev !== 'torpor' && act === 'sleep') log(s, t, '은신처로 들어가 몸을 말고 잠들었어요');
}
function addPoop(s, where) {
  if (s.poops.length >= 14) return;
  s.poops.push(where === 'wheel' ? { w: 1, a: rand(-.5, .5) } : { w: 0, x: rand(222, 372), y: rand(250, 258) });
  s.tot.poops++;
  s.dirt = clamp(s.dirt + 3);
  if (where === 'wheel') s.feetDirty = true;
}

// Advance the world by ms (≤ 1 minute per call) ending at t. busy = owner is holding or walking the hedgehog.
function step(s, ms, t, busy) {
  const m = ms / MIN;
  const temp = cageTemp(s, t);
  const aw = ageWeeks(s, t), tw = targetWeight(aw);
  if (s.night.key !== nightKey(t) && hourOf(t) >= 18) s.night = { key: nightKey(t), wheel: 0 };

  // temperature: too cold for hours and the hedgehog tries to hibernate, which is dangerous for pygmy hedgehogs
  s.cold = temp < 20.5 ? s.cold + m : Math.max(0, s.cold - 2 * m);
  if (!s.torpor && s.cold > 150) { s.torpor = true; endSession(s, t); s.act = 'torpor'; s.actUntil = t + 30 * MIN; log(s, t, `케이지가 너무 추워서(${temp.toFixed(1)}°C) 동면을 시도하고 있어요. 몸이 차갑고 움직이지 않아요`, true); }
  if (s.torpor && temp >= 23 && s.cold === 0) { s.torpor = false; s.act = 'rest'; s.actUntil = t + 20 * MIN; log(s, t, '몸이 다시 따뜻해져서 천천히 움직이기 시작했어요'); }

  if (!busy && t >= s.actUntil) { const [a, mins] = chooseActivity(s, t); setAct(s, a, t, mins); }
  else if (!busy && !s.torpor && s.act === 'sleep' && isNight(t)) { const [a, mins] = chooseActivity(s, t); setAct(s, a, t, mins); }
  else if (!busy && !s.torpor && s.act !== 'sleep' && !isNight(t) && hourOf(t) < 12) { setAct(s, 'sleep', t, 30); }

  const act = busy ? 'busy' : s.act;
  const sleeping = act === 'sleep' || act === 'torpor';
  s.satiety -= (sleeping ? .06 : .12) * m * (act === 'torpor' ? .3 : 1);
  s.hydration -= (sleeping ? .07 : .15) * m * (act === 'torpor' ? .3 : 1);

  if (act === 'eat' && s.food > 0 && s.satiety < 96) {
    const g = Math.min(s.food, .32 * m);
    s.food -= g; s.satiety += g * 8; s.tot.food += g; if (s.sess) s.sess.g += g;
    if (s.food <= 0) { s.food = 0; log(s, t, '사료 그릇이 비었어요', true); s.actUntil = t; }
  }
  if (act === 'drink' && s.water > 0 && s.hydration < 97) {
    const ml = Math.min(s.water, 1.6 * m);
    s.water -= ml; s.hydration += ml * 5; s.tot.water += ml;
    if (s.water <= 0) { s.water = 0; log(s, t, '물그릇이 비었어요', true); s.actUntil = t; }
  }

    s.satiety -= .05 * m; s.weight -= .00008 * meters;

  if (act === 'roam' && Math.random() < m / 70) addPoop(s, 'bed');
  if (act === 'eat' || act === 'drink' || act === 'roam') s.water -= .02 * m; // some water gets kicked out of the bowl

  // weight: grows toward the target while well fed, loses weight when hungry
  const h = m / 60;
  if (s.satiety > 50) s.weight += (s.weight < tw ? 1.05 : .04) * h;
  if (s.satiety < 20) s.weight -= .9 * h;
  if (s.hydration < 15) s.weight -= .4 * h;

  s.dirt += .0045 * m;
  s.nails += .005 * m;
  s.trust -= .0015 * m;

  // quill loss during quilling (8-12 weeks) leaves quills in the bedding

  if (s.nails > 80) dh -= .012;
  if (s.weight < lo || s.weight > hi) dh -= .02;
  if (s.torpor) dh -= .06;
  if (s.mites) dh -= .03;

  s.health += dh * m;
  if (!s.mites && s.dirt > 72 && Math.random() < m / (60 * 30)) { s.mites = true; log(s, t, '몸을 자꾸 긁고 가시가 평소보다 많이 빠져요. 진드기가 의심돼요', true); }
  if (s.weight > hi && !s.flags.fat) { s.flags.fat = true; log(s, t, '체중이 적정 범위를 넘었어요. 간식을 줄이고 운동을 시켜 주세요', true); }
  if (s.weight <= hi * .97) s.flags.fat = false;

  for (const k of ['satiety', 'hydration', 'dirt', 'nails', 'trust', 'health']) s[k] = clamp(s[k]);
  s.food = Math.max(0, s.food); s.water = Math.max(0, s.water);
}
function catchUp(s, until) {
  let t = Math.max(s.last, until - 72 * HOUR);

  s.last = until;

// Where the hedgehog is and how it is drawn, from its current activity.
function hogPlace(now) {
  const size = clamp((S.weight - 120) / 280, 0, 1);
  const sc = .19 + .11 * size;
  if (T.mode === 'hand') return { layer: 'none' };
  if (T.mode === 'out') return { layer: 'hogOut', x: T.out.x, y: 286, s: sc * 1.15, mode: 'walk', cls: 'walking', flip: T.out.left, move: true };
  if (now < T.antUntil && !['sleep', 'torpor', 'rest', 'wheel'].includes(S.act)) return { layer: 'hogFront', x: 262, y: 254, s: sc, mode: 'ant' };
  switch (S.act) {
    case 'sleep': return { layer: 'hogBack', x: 180, y: 250, s: sc * .95, mode: 'sleep' };
    case 'torpor': return { layer: 'hogFront', x: 366, y: 257, s: sc * .95, mode: 'ball' };
    case 'wheel': return { layer: 'hogFront', x: 330, y: 238, s: sc, mode: 'run', cls: 'running', spin: true };
    case 'eat': return { layer: 'hogFront', x: 238 - 92 * sc, y: 252, s: sc, mode: 'eat' };
    case 'drink': return { layer: 'hogFront', x: 278 - 94 * sc, y: 253, s: sc, mode: 'drink' };
    case 'rest': return { layer: 'hogFront', x: 304, y: 257, s: sc * .95, mode: 'sleep' };
    default: { // roam
      if (!T.roam || now > T.roam.until) { const x = rand(226, 300); T.roam = { x, left: T.roam ? x < T.roam.x : false, until: now + rand(4000, 8000) }; }
      return { layer: 'hogFront', x: T.roam.x, y: 254, s: sc, mode: 'walk', cls: 'walking', flip: T.roam.left, move: true };
    }
  }
}
const VIEW_ROOM = '0 0 400 300', VIEW_CAGE = '122 96 276 207';
function setView() {
  const close = T.zoom && T.mode !== 'out';
  $('room').setAttribute('viewBox', close ? VIEW_CAGE : VIEW_ROOM);
  $('zoomBtn').textContent = close ? '방 전체 보기' : '가까이 보기';
  $('zoomBtn').hidden = T.mode === 'hand' || T.mode === 'out';
}
$('zoomBtn').addEventListener('click', () => { T.zoom = !T.zoom; try { localStorage.setItem('hedgehog-zoom', T.zoom ? '1' : ''); } catch (e) { /* ignore */ } setView(); });
try { T.zoom = !!localStorage.getItem('hedgehog-zoom'); } catch (e) { T.zoom = false; }
function placeHog(now) {
  setView();
  const p = hogPlace(now);
  $('wheelSpin').classList.toggle('spin', !!p.spin);
  let g = $('hogG');
  if (p.layer === 'none') { if (g) g.remove(); T.lastSprite = ''; return; }
  const size = clamp((S.weight - 120) / 280, 0, 1);
  const spriteKey = [p.mode, S.morph, size.toFixed(1)].join('|');
  if (!g) { g = document.createElementNS(SVGNS, 'g'); g.id = 'hogG'; T.lastSprite = ''; }
  const layer = $(p.layer);
  const jump = g.parentNode !== layer || !p.move;
  if (g.parentNode !== layer) layer.appendChild(g);
  if (spriteKey !== T.lastSprite) { g.innerHTML = `<g class="${p.cls || ''}">${hogMarkup(p.mode, S.morph, size)}</g>`; T.lastSprite = spriteKey; }
  else { const inner = g.firstElementChild; if (inner) inner.setAttribute('class', p.cls || ''); }
  const tx = p.flip ? p.x + 120 * p.s : p.x - 120 * p.s;
  const tf = `translate(${tx.toFixed(1)}px, ${(p.y - 184 * p.s).toFixed(1)}px) scale(${p.flip ? -p.s : p.s}, ${p.s})`;
  if (tf !== T.lastPos) {
    g.classList.toggle('jump', jump);
    g.style.transform = tf;
    T.lastPos = tf;
  }
}

  openSheet(`<h3>동물병원 진료 결과</h3><p>체중 ${Math.round(S.weight)}g · 체온 ${S.torpor ? '낮음' : '정상'}</p><ul>${notes.map((n) => `<li>${n}</li>`).join('')}</ul>
    <p>이동 스트레스로 조금 예민해졌어요.</p><div class="actions"><button class="btn" type="button" data-close>확인</button></div>`);
}

/* ================= holding the hedgehog ================= */
function startHandling() {
  const now = Date.now();
  const wasSleeping = sleepingNow() || S.act === 'sleep';
  const cold = S.torpor;
  endSession(S, now);
  T.mode = 'hand';
  const quilling = ageWeeks(S, now) < 12.5;
  const h = { start: now, gained: 0, strokes: [], treat: false, ant: false, cold, quilling };
  // How long it stays rolled up depends on trust, quilling, and whether it was woken.
  let curl = 1200 + (100 - S.trust) * 55 + (quilling ? 2000 : 0);
  if (wasSleeping && !isNight(now)) { curl += 3000; S.trust = clamp(S.trust - 2); log(S, now, `자고 있던 ${S.name}을(를) 꺼내서 손에 올렸어요. 잠이 덜 깨 예민해요`); }
  if (cold) curl = 1e9;
  h.state = S.trust > 70 && !wasSleeping && !quilling ? 'calm' : 'curl';
  h.until = now + (h.state === 'curl' ? curl : 0);
  T.hand = h;
  $('overlay').innerHTML = `<div class="hand">
    <div class="hand-stage" id="handStage"></div>
    <div class="hand-say" id="handSay"></div>
    <div class="hand-bar">
      <button type="button" id="hStroke">살살 쓰다듬기</button>
      <button type="button" id="hWorm">손으로 밀웜 주기</button>
      <button type="button" id="hDown" class="done">내려놓기</button>
    </div></div>`;
  $('hStroke').addEventListener('click', handStroke);
  $('hWorm').addEventListener('click', handWorm);
  $('hDown').addEventListener('click', endHandling);
  T.handTimer = setInterval(handTick, 400);
  handDraw(true);
  render();
}
const HAND_TEXT = {
  curl: '손 위에서 몸을 공처럼 말고 있어요. 가만히 기다려 주면 천천히 풀어요.',
  huff: '"후웁, 후웁" 소리를 내며 이마 가시를 세웠어요. 아직 경계 중이에요.',
  calm: '몸을 풀고 코를 킁킁거리며 손 냄새를 맡고 있어요.',
  explore: '손바닥 위를 천천히 걸어 다니며 탐색하고 있어요.',
  eat: '손가락 사이의 밀웜을 받아서 오물오물 먹고 있어요.',
  ant: '손 냄새가 신기한지 침 거품을 만들어 가시에 바르는 안팅을 해요.',
  cold: '몸이 차갑고 거의 움직이지 않아요. 손의 온기로 천천히 데워 주고 있어요.',
};
function handDraw(force) {
  const h = T.hand; if (!h) return;
  const size = clamp((S.weight - 120) / 280, 0, 1);
  const mode = { curl: 'ball', huff: 'huff', calm: 'stand', explore: 'walk', eat: 'eat', ant: 'ant', cold: 'ball' }[h.state];
  const key = mode + size.toFixed(1);
  if (force || key !== h.key) {
    h.key = key;
    $('handStage').innerHTML = `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">

      <g transform="translate(${200 - 120 * .95} ${206 - 184 * .95}) scale(.95)" class="${mode === 'walk' ? 'walking' : ''}">${hogMarkup(mode, S.morph, size)}</g></svg>`;
  }
  $('handSay').textContent = HAND_TEXT[h.state];
  $('hWorm').disabled = h.treat || h.state === 'cold';
}
function handTick() {
  const h = T.hand; if (!h) return;
  const now = Date.now();
  if (h.cold) {
    S.cold = 0;
    if (S.heater && now - h.start > 8000) { h.cold = false; S.torpor = false; h.state = 'curl'; h.until = now + 2500; log(S, now, '손의 온기와 히터 덕분에 몸이 따뜻해져 깨어났어요'); }
    else h.state = 'cold';
  } else if (now >= h.until) {
    if (h.state === 'curl') { h.state = 'huff'; h.until = now + 1800; }
    else if (h.state === 'huff' || h.state === 'eat' || h.state === 'ant') { h.state = 'calm'; h.until = now + rand(3000, 6000); }
    else if (h.state === 'calm') {
      if (!h.ant && S.trust > 45 && Math.random() < .12) { h.ant = true; h.state = 'ant'; h.until = now + 5000; log(S, now, '손 냄새를 맡고 안팅을 했어요'); }
      else { h.state = 'explore'; h.until = now + rand(3000, 6000); }
    } else if (h.state === 'explore') { h.state = 'calm'; h.until = now + rand(3000, 6000); }
  }
  handDraw();
}
function handStroke() {
  const h = T.hand; if (!h || h.state === 'cold') return;
  const now = Date.now();
  h.strokes = h.strokes.filter((x) => now - x < 2500); h.strokes.push(now);
  if (h.state === 'curl' || h.state === 'huff') {
    if (h.strokes.length >= 3) { h.state = 'curl'; h.until = now + 2500; toast('너무 자주 만지면 더 몸을 말아요. 기다려 주세요'); }
    else h.until -= 400; // gentle touch helps it relax a little
  } else if (h.strokes.length >= 4) {
    h.state = 'huff'; h.until = now + 1800; S.trust = clamp(S.trust - .5);
    toast('연달아 만져서 놀랐어요. 천천히 쓰다듬어 주세요');
  } else if (h.gained < 6) {
    const g = .8; h.gained += g; S.trust = clamp(S.trust + g);
    $('handSay').textContent = '가시 결을 따라 머리에서 꼬리 쪽으로 쓰다듬었어요. 가시를 눕히고 편안해해요.';
    return;
  }
  handDraw();
}
function handWorm() {
  const h = T.hand; if (!h || h.treat) return;
  const now = Date.now();
  if (h.state === 'curl') { toast('몸을 말고 있어서 먹지 않아요. 풀 때까지 기다려 주세요'); return; }
  h.treat = true;
  if (S.treats.day !== dayKey(now)) S.treats = { day: dayKey(now), n: 0 };
  S.treats.n++; S.satiety = clamp(S.satiety + 4); S.weight += S.treats.n > TREAT_LIMIT ? 2.5 : .6;
  const g = Math.min(2.5, 9 - h.gained); if (g > 0) { h.gained += g; S.trust = clamp(S.trust + g); }
  h.state = 'eat'; h.until = now + 2600;
  if (S.treats.n > TREAT_LIMIT) toast(`오늘 밀웜 ${S.treats.n}마리째예요. 너무 많으면 살이 쪄요`);
  handDraw();
}
function endHandling() {
  const h = T.hand; if (!h) return;
  const now = Date.now(), secs = Math.round((now - h.start) / 1000);
  clearInterval(T.handTimer);
  const calm = h.state === 'calm' || h.state === 'explore' || h.state === 'eat';
  if (calm && secs >= 20) { S.trust = clamp(S.trust + 2); h.gained += 2; }
  T.hand = null; T.mode = null;
  $('overlay').innerHTML = '';
  if (!S.torpor) { S.act = isNight(now) ? 'roam' : 'sleep'; S.actUntil = now + (isNight(now) ? 5 : 30) * MIN; S.sess = null; }
  log(S, now, `${secs}초 동안 손에 올려 교감했어요${h.treat ? ' (밀웜 1마리)' : ''}. ${calm ? '편안한 상태로 내려놓았어요' : '아직 경계하는 상태로 내려놓았어요'}`);
  done(h.gained >= 1 ? '신뢰가 조금 쌓였어요' : '매일 저녁 조금씩 만져 주면 신뢰가 쌓여요');
}

function startOuting() {
  const now = Date.now();
  if (S.torpor) return toast('체온이 낮아서 지금은 밖에 내보내면 안 돼요');
  disturb('거실 산책');
  endSession(S, now);
  T.mode = 'out';
  T.out = { start: now, x: 60, left: false, next: 0, until: now + 45000 };
  log(S, now, '케이지 밖 거실 바닥에 내려놓았어요. 옆에서 지켜보는 중이에요');
  $('overlay').innerHTML = `<div style="position:absolute;right:10px;bottom:10px"><button class="btn" type="button" id="outEnd">케이지로 돌려보내기</button></div>`;
  $('outEnd').addEventListener('click', endOuting);
  render();
}
function outingTick(now) {
  const o = T.out; if (!o) return;
  if (now >= o.until) return endOuting();
  if (now >= o.next) {
    const x = rand(18, 120);
    o.left = x < o.x; o.x = x; o.next = now + rand(3000, 5500);
    if (Math.random() < .25) toast(pick(['소파 밑 냄새를 킁킁 맡고 있어요', '바닥 틈새를 코로 탐색하고 있어요', '러그 위를 종종걸음으로 걸어요', '잠깐 멈춰서 주변 소리에 귀를 기울여요']));
  }
}
function endOuting() {
  const o = T.out; if (!o) return;
  const now = Date.now(), secs = Math.round((now - o.start) / 1000);
  T.mode = null; T.out = null;
  $('overlay').innerHTML = '';
  const mins = Math.max(3, Math.round(secs / 4.5));
  S.trust = clamp(S.trust + (secs > 25 ? 2 : 1)); S.satiety = clamp(S.satiety - 2); S.weight -= .3;
  if (Math.random() < .25) addPoop(S, 'bed');
  S.act = isNight(now) ? 'roam' : 'sleep'; S.actUntil = now + 5 * MIN; S.sess = null;
  log(S, now, `거실을 ${mins}분 정도 탐험하고 케이지로 돌아왔어요`);
  done('케이지로 돌려보냈어요');
}

function weightChart() {
  const W = S.weights;
  if (W.length < 2) return '<p>체중을 두 번 이상 재면 그래프가 나타나요.</p>';
  const w = 320, h = 140, pl = 34, pr = 8, pt = 10, pb = 20;
  const t0 = W[0].t, t1 = W[W.length - 1].t || t0 + 1;
  const band = W.map((p) => targetWeight(ageWeeks(S, p.t)));
  const vals = W.map((p) => p.g).concat(band.map((b) => b * 1.15), band.map((b) => b * .85));
  const lo = Math.floor(Math.min(...vals) / 20) * 20, hi = Math.ceil(Math.max(...vals) / 20) * 20;
  const X = (t) => pl + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (w - pl - pr);
  const Y = (g) => pt + (1 - (g - lo) / (hi - lo)) * (h - pt - pb);
  const bandPath = W.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(band[i] * 1.15).toFixed(1)}`).join('') + W.slice().reverse().map((p, i) => `L${X(p.t).toFixed(1)} ${Y(band[W.length - 1 - i] * .85).toFixed(1)}`).join('') + 'Z';
  const line = W.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.g).toFixed(1)}`).join('');
  const last = W[W.length - 1];
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="체중 변화 그래프">
    ${ticks.map((g) => `<line x1="${pl}" x2="${w - pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${pl - 4}" y="${Y(g) + 3}" text-anchor="end">${g}g</text>`).join('')}
    <path d="${bandPath}" fill="var(--accent)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${W.map((p) => `<circle cx="${X(p.t)}" cy="${Y(p.g)}" r="2" fill="var(--accent)"/>`).join('')}
    <circle cx="${X(last.t)}" cy="${Y(last.g)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${pl}" y="${h - 4}">${new Date(t0).getMonth() + 1}/${new Date(t0).getDate()}</text>
    <text x="${w - pr}" y="${h - 4}" text-anchor="end">${new Date(t1).getMonth() + 1}/${new Date(t1).getDate()}</text>
  </svg><p style="font-size:12px">옅은 띠는 나이별 적정 체중 범위예요.</p>`;
}

  const choice = { sex: 'm', morph: 'sp' };
  render();
  const morphs = Object.entries(COATS).map(([k, c]) => `<button class="opt" type="button" data-morph="${k}" aria-pressed="${k === 'sp'}">${hogSvg('stand', k, .3)}${c.label}</button>`).join('');
  openSheet(`<h3>고슴도치 데려오기</h3>
    <p>생후 8주 된 아프리카 피그미 고슴도치를 집으로 데려왔어요. 케이지와 은신처, 쳇바퀴, 히터는 준비되어 있어요.</p>
    <div class="sec">이름</div>
    <input class="input" id="adName" maxlength="12" value="도치" autocomplete="off" aria-label="이름">
    <div class="sec">색</div>
    <div class="opts">${morphs}</div>
    <div class="sec">성별</div>
    <div class="opts two"><button class="opt" type="button" data-sex="m" aria-pressed="true">수컷</button><button class="opt" type="button" data-sex="f" aria-pressed="false">암컷</button></div>
    <div class="actions"><button class="btn" type="button" id="adGo">집에 데려오기</button></div>`);
  sheet.querySelectorAll('[data-morph]').forEach((b) => b.addEventListener('click', () => {
    choice.morph = b.dataset.morph;
    sheet.querySelectorAll('[data-morph]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    S.morph = choice.morph; T.lastSprite = ''; render();
  }));
  sheet.querySelectorAll('[data-sex]').forEach((b) => b.addEventListener('click', () => {
    choice.sex = b.dataset.sex;
    sheet.querySelectorAll('[data-sex]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  }));
  $('adGo').addEventListener('click', () => {
    const name = $('adName').value.trim() || '도치';
    S = newState(name, choice.sex, choice.morph);
    const now = Date.now();
    S.act = isNight(now) ? 'roam' : 'sleep'; S.actUntil = now + 20 * MIN;
    log(S, now, `${name}을(를) 집에 데려왔어요. 낯선 곳이라 아직 많이 경계해요`);
    adopted = true; T.lastSprite = '';
    closeSheet(); render(); save();
    toast(isNight(now) ? '밤이라 깨어 있어요. 오늘은 조용히 지켜봐 주세요' : '낮이라 은신처에서 자고 있어요. 저녁에 깨어나요');
  });
}

/* ================= main loop ================= */
let ticks = 0;
function tick() {
  if (!adopted) return;
  const now = Date.now(), gap = now - S.last;
  if (gap > 90e3) {
    // the page was in the background: replay the missed time minute by minute
    const before = { tot: Object.assign({}, S.tot), last: S.last };
    catchUp(S, now);
    if (gap > 30 * MIN && sheetWrap.hidden && !T.mode) showReturn(before, gap);
  } else {
    step(S, Math.max(0, gap), now, !!T.mode);
    S.last = now;
  }
  if (T.mode === 'out') outingTick(now);
  render();
  if (++ticks % 5 === 0) save();
}

function start(data) {
  const saved = data && data.S ? data.S : load();
  if (saved && saved.v === 1 && saved.morph) {
    S = saved; adopted = true;
    const before = { tot: Object.assign({}, S.tot), last: S.last };
    const away = Date.now() - S.last;
    catchUp(S, Date.now());
    render(); save();
    if (!(data && data.S) && away > 30 * MIN) showReturn(before, away);
  } else showAdoption();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); else tick(); });
  window.addEventListener('pagehide', save);
}

if (window.claude?.hot) window.claude.hot.snapshot?.(() => ({ S: adopted ? S : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
